server {
    listen 80 default_server;
    server_name inkforge.cn www.inkforge.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        return 308 https://inkforge.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.inkforge.cn;

    ssl_certificate /etc/letsencrypt/live/inkforge.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkforge.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 308 https://inkforge.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name inkforge.cn;

    ssl_certificate /etc/letsencrypt/live/inkforge.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkforge.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:43120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
