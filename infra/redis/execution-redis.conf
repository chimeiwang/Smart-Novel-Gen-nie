bind 0.0.0.0
protected-mode no
port 6379
dir /data

# 尚未送达 Core 的模型终态只能存在于该 journal；写响应必须跨过 fsync 边界。
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
aof-load-truncated no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 8mb

# 128 MiB 容器内为 live dataset、rewrite CoW 和 Redis/AOF 缓冲分别留界限。
maxmemory 32mb
maxmemory-policy noeviction
hash-max-listpack-value 4096
hash-max-listpack-entries 64
save ""
