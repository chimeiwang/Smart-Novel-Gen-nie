spring:
  application:
    name: inkforge-core-api
  threads:
    virtual:
      enabled: true
  main:
    # Spring MVC 的 SSE/文件异步流使用虚拟线程；显式 keep-alive 避免只剩虚拟线程时 JVM 提前退出。
    keep-alive: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # 视频输入最多 200 MiB；各领域存储层仍分别执行 50/30/100/200 MiB 精确上限。
      max-file-size: 200MB
      max-request-size: 201MB

logging:
  pattern:
    # 显示 SLF4J fluent 键值；监督器的异常诊断只记录安全栈帧，不传入 Throwable 文本。
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger : %msg %kvp %ex%n"

server:
  port: ${PORT:8000}
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    enabled-by-default: false
