name: Durable Agent V2 开发证据（可信骨架，当前 fail closed）

"on":
  workflow_dispatch:
    inputs:
      target_release_commit:
        description: main HEAD 的精确 40 位提交
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: durable-agent-v2-development
  cancel-in-progress: false

jobs:
  trusted_context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_release_commit: ${{ steps.trusted.outputs.target_release_commit }}
    steps:
      - name: 可信 context 门禁（任何 checkout/environment/secret 之前）
        id: trusted
        shell: bash
        env:
          INPUT_TARGET_RELEASE_COMMIT: ${{ inputs.target_release_commit }}
          TRUSTED_EVENT_NAME: ${{ github.event_name }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TRUSTED_EVENT_NAME" = workflow_dispatch
          test "$TRUSTED_REF" = refs/heads/main
          test "$TRUSTED_RUN_ATTEMPT" = 1
          case "$TRUSTED_RUN_ID" in ""|0|*[!0-9]*) exit 1 ;; esac
          case "$TRUSTED_SHA" in ""|*[!0-9a-f]*) exit 1 ;; esac
          test "${#TRUSTED_SHA}" -eq 40
          test "$INPUT_TARGET_RELEASE_COMMIT" = "$TRUSTED_SHA"
          printf 'target_release_commit=%s\n' "$TRUSTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout 精确 trusted main HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 复验 checkout 身份
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ steps.trusted.outputs.target_release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_RELEASE_COMMIT"
          test -z "$(git status --short)"

  offline_validation:
    needs: trusted_context
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout 精确候选
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 固定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: 固定 uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true

      - name: 固定 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: 固定 Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 安装冻结依赖
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --group dev
          npm ci

      - name: 当前候选全量离线门禁
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ needs.trusted_context.outputs.target_release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_RELEASE_COMMIT"
          uv run ruff check .
          uv run mypy apps/core-api/src apps/agent-service/src \
            packages/service-contracts/src packages/service-auth/src
          uv run pytest -q
          ./mvnw verify
          npm run typecheck
          npm run lint
          npm run test:web
          npm run api:check
          npm run build

      - name: 本地 Fake fault evidence 只作前置
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/durable_agent_v2_development_producer.py \
            assert-local-fault-boundary \
            --evidence-class local-fake-prerequisite-only

      - name: 生成并复验仅供离线诊断的 canonical blocked plan
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ needs.trusted_context.outputs.target_release_commit }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/durable-agent-v2-development-remote-plan"
          created="$(python3 scripts/durable_agent_v2_development_producer.py \
            create-blocked-plan \
            --repository "$GITHUB_REPOSITORY" \
            --target-release-commit "$TARGET_RELEASE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir "$plan_dir")"
          plan_sha="${created##*:}"
          python3 scripts/durable_agent_v2_development_producer.py \
            verify-blocked-plan \
            --repository "$GITHUB_REPOSITORY" \
            --target-release-commit "$TARGET_RELEASE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --plan-dir "$plan_dir" \
            --expected-sha256 "$plan_sha"

  development_evidence:
    needs:
      - trusted_context
      - offline_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: development
    steps:
      - name: Checkout 精确候选
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 采集 development environment 外部策略（仅 GitHub API）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ENVIRONMENT_POLICY_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN"
          policy_dir="$RUNNER_TEMP/development-environment-policy"
          mkdir "$policy_dir"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development" \
            > "$policy_dir/environment.json"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/deployment-branch-policies?per_page=100" \
            > "$policy_dir/branch-policies.json"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/secrets?per_page=100" \
            > "$policy_dir/secrets.json"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/variables?per_page=100" \
            > "$policy_dir/variables.json"
          chmod 600 "$policy_dir"/*.json

      - name: 无令牌语义验证 development environment 外部策略
        shell: bash
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/development-environment-policy"
          python3 scripts/durable_agent_v2_development_producer.py \
            verify-environment-policy \
            --environment-json "$policy_dir/environment.json" \
            --branch-policies-json "$policy_dir/branch-policies.json" \
            --secrets-json "$policy_dir/secrets.json" \
            --variables-json "$policy_dir/variables.json"

      - name: 确定性复验 checkout source 与 build definition
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ needs.trusted_context.outputs.target_release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_RELEASE_COMMIT"
          test -z "$(git status --short)"
          policy_dir="$RUNNER_TEMP/development-environment-policy"
          binding_dir="$RUNNER_TEMP/durable-agent-v2-checkout-binding"
          mkdir "$binding_dir"
          printf 'target %s\0' "$TARGET_RELEASE_COMMIT" \
            > "$binding_dir/source-tree.manifest"
          git ls-tree -rz --full-tree "$TARGET_RELEASE_COMMIT" \
            >> "$binding_dir/source-tree.manifest"
          chmod 600 "$binding_dir/source-tree.manifest"
          source_tree_sha256_line="$(sha256sum -- "$binding_dir/source-tree.manifest")"
          source_tree_sha256="${source_tree_sha256_line%% *}"
          test "$source_tree_sha256_line" = \
            "$source_tree_sha256  $binding_dir/source-tree.manifest"
          case "$source_tree_sha256" in ""|*[!0-9a-f]*) exit 1 ;; esac
          test "${#source_tree_sha256}" -eq 64
          python3 scripts/durable_agent_v2_development_producer.py \
            verify-checkout-bindings \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-tree-manifest "$binding_dir/source-tree.manifest" \
            --target-release-commit "$TARGET_RELEASE_COMMIT" \
            --variables-json "$policy_dir/variables.json" \
            --expected-source-tree-sha256 "$source_tree_sha256"

      - name: 固定阻断真实远程 driver、2C2G、provider 与 cleanup（零远程动作）
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ needs.trusted_context.outputs.target_release_commit }}
        run: |
          set -euo pipefail
          echo 'development-evidence:error:real-provider-identity-not-automated' >&2
          python3 scripts/durable_agent_v2_development_producer.py \
            assert-remote-capabilities-unavailable \
            --repository "$GITHUB_REPOSITORY" \
            --target-release-commit "$TARGET_RELEASE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
