name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://inkforge:ci-placeholder@localhost:5432/inkforge
      JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      MODEL_PROVIDER: fake
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-v4-flash
      LANGSMITH_TRACING_ENABLED: "false"
      WORKFLOW_EVENT_LOG_ENABLED: "false"
      WORKFLOW_EVENT_DEBUG_ENABLED: "false"
      LANGGRAPH_STUDIO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Test Java migration workspace
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee maven-verify.log
          verify_status=${PIPESTATUS[0]}
          if [ "$verify_status" -ne 0 ]; then
            {
              echo "## Java 迁移工作区验证失败"
              echo '```text'
              tail -n 200 maven-verify.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 优先截取失败测试及其断言；普通构建失败才回退到 Maven 最后 20 行。
            failure_excerpt="$(grep -E -A 8 '<<< (FAILURE|ERROR)!' maven-verify.log | tail -n 24)"
            if [ -n "$failure_excerpt" ]; then
              annotation="$failure_excerpt"
            else
              annotation="$(tail -n 20 maven-verify.log)"
            fi
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\n'/'%0A'}"
            annotation="${annotation//$'\r'/'%0D'}"
            echo "::error title=Java 迁移工作区验证失败::$annotation"
          fi
          exit "$verify_status"

      - name: Check generated API client
        run: npm run api:check

      - name: Test Web and API client
        run: npm run test:web

      - name: Test Python workspace
        shell: bash
        run: |
          set +e
          uv run pytest -q 2>&1 | tee pytest.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            {
              echo "## Python 测试失败"
              echo '```text'
              tail -n 200 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            annotation="$(tail -n 80 pytest.log)"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\n'/'%0A'}"
            annotation="${annotation//$'\r'/'%0D'}"
            echo "::error title=Python 测试失败::$annotation"
          fi
          exit "$test_status"

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy apps/core-api/src apps/agent-service/src packages/service-contracts/src packages/service-auth/src

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
