name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-java:
    concurrency:
      group: ci-java-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://inkforge:ci-placeholder@localhost:5432/inkforge
      JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      MODEL_PROVIDER: fake
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-v4-flash
      LANGSMITH_TRACING_ENABLED: "false"
      WORKFLOW_EVENT_LOG_ENABLED: "false"
      WORKFLOW_EVENT_DEBUG_ENABLED: "false"
      LANGGRAPH_STUDIO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Java migration workspace
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee maven-verify.log
          verify_status=${PIPESTATUS[0]}
          if [ "$verify_status" -ne 0 ]; then
            {
              echo "## Java 迁移工作区验证失败"
              echo '```text'
              tail -n 200 maven-verify.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 优先截取失败测试及其断言；普通构建失败才回退到 Maven 最后 20 行。
            failure_excerpt="$(grep -E -A 8 '<<< (FAILURE|ERROR)!' maven-verify.log | tail -n 24)"
            if [ -n "$failure_excerpt" ]; then
              annotation="$failure_excerpt"
            else
              annotation="$(tail -n 20 maven-verify.log)"
            fi
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\n'/'%0A'}"
            annotation="${annotation//$'\r'/'%0D'}"
            echo "::error title=Java 迁移工作区验证失败::$annotation"
          fi
          exit "$verify_status"

  ci-python:
    concurrency:
      group: ci-python-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://inkforge:ci-placeholder@localhost:5432/inkforge
      JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      MODEL_PROVIDER: fake
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-v4-flash
      LANGSMITH_TRACING_ENABLED: "false"
      WORKFLOW_EVENT_LOG_ENABLED: "false"
      WORKFLOW_EVENT_DEBUG_ENABLED: "false"
      LANGGRAPH_STUDIO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Test Python workspace
        shell: bash
        run: |
          set +e
          uv run pytest -q 2>&1 | tee pytest.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            {
              echo "## Python 测试失败"
              echo '```text'
              tail -n 200 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            annotation="$(tail -n 80 pytest.log)"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\n'/'%0A'}"
            annotation="${annotation//$'\r'/'%0D'}"
            echo "::error title=Python 测试失败::$annotation"
          fi
          exit "$test_status"

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy apps/agent-service/src packages/service-contracts/src packages/service-auth/src

  ci-web:
    concurrency:
      group: ci-web-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://inkforge:ci-placeholder@localhost:5432/inkforge
      JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      MODEL_PROVIDER: fake
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-v4-flash
      LANGSMITH_TRACING_ENABLED: "false"
      WORKFLOW_EVENT_LOG_ENABLED: "false"
      WORKFLOW_EVENT_DEBUG_ENABLED: "false"
      LANGGRAPH_STUDIO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check generated API client
        run: npm run api:check

      - name: Test Web and API client
        run: npm run test:web

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # 保留稳定的 ci 检查名；被取消或跳过的分支不能冒充全量验证成功。
  ci:
    needs: [ci-java, ci-python, ci-web]
    if: ${{ always() }}
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: 汇总完整 CI 结果
        env:
          JAVA_RESULT: ${{ needs.ci-java.result }}
          PYTHON_RESULT: ${{ needs.ci-python.result }}
          WEB_RESULT: ${{ needs.ci-web.result }}
        shell: bash
        run: |
          if [ "$JAVA_RESULT" != success ] || [ "$PYTHON_RESULT" != success ] || [ "$WEB_RESULT" != success ]; then
            echo "::error title=CI 验证未全部成功::Java=${JAVA_RESULT}，Python=${PYTHON_RESULT}，Web=${WEB_RESULT}"
            exit 1
          fi
          echo "Java、Python、Web 验证全部成功"

  publish-images:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chimeiwang/Smart-Novel-Gen-nie'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布 Web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/chimeiwang/smart-novel-gen-nie/web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/chimeiwang/Smart-Novel-Gen-nie
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: 构建并发布 Core
        id: core-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/core-api.Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/chimeiwang/smart-novel-gen-nie/core-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/chimeiwang/Smart-Novel-Gen-nie
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,scope=core-api,mode=max

      - name: 构建并发布 Agent
        id: agent-service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/agent-service.Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/chimeiwang/smart-novel-gen-nie/agent-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/chimeiwang/Smart-Novel-Gen-nie
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent-service
          cache-to: type=gha,scope=agent-service,mode=max

      - name: 生成发布清单
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CORE_DIGEST: ${{ steps.core-api.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent-service.outputs.digest }}
        run: |
          mkdir -p release-artifact
          python3 scripts/release_manifest.py create \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output "release-artifact/inkforge-release-${SOURCE_SHA}-${SOURCE_RUN_ID}.json" \
            --web-digest "$WEB_DIGEST" \
            --core-api-digest "$CORE_DIGEST" \
            --agent-service-digest "$AGENT_DIGEST"

      - name: 上传发布清单
        id: release-artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkforge-release-${{ github.sha }}-${{ github.run_id }}
          path: release-artifact/inkforge-release-${{ github.sha }}-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  deploy:
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chimeiwang/Smart-Novel-Gen-nie'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-release.yml
    with:
      source_sha: ${{ github.sha }}
      source_run_id: ${{ github.run_id }}
      artifact_id: ${{ needs.publish-images.outputs.artifact-id }}
    secrets: inherit
