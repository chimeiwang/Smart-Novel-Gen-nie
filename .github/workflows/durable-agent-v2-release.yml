          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
          VERIFIED_DRAIN_SHA256: ${{ steps.prepare_release.outputs.verified_drain_sha256 }}
          CANARY_USER_ID: ${{ inputs.canary_user_id }}
          CANARY_NOVEL_ID: ${{ inputs.canary_novel_id }}
        run: |
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q RELEASE_ACTION=allowlist_release RELEASE_MANIFEST_SHA256=%q RELEASE_MANIFEST_DIR=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q VERIFIED_DRAIN_SHA256=%q CANARY_USER_ID=%q CANARY_NOVEL_ID=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q finalize-allowlist-transaction' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$TARGET_RELEASE_COMMIT" \
            "$RELEASE_MANIFEST_SHA256" "$RELEASE_MANIFEST_DIR" \
            "$DURABLE_AGENT_RELEASE_LOCK_ID" "$CONTROL_BUNDLE_DIR" \
            "$CONTROL_BUNDLE_SHA256" "$VERIFIED_DRAIN_SHA256" \
            "$CANARY_USER_ID" "$CANARY_NOVEL_ID" "$WORKFLOW_TRUSTED_COMMIT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"

      - name: rollback 后 V2-aware route-off 门禁
        if: inputs.action == 'rollback'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_RELEASE_COMMIT: ${{ steps.metadata.outputs.target_release_commit }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          RELEASE_MANIFEST_DIR: ${{ steps.upload_rollback_manifest.outputs.remote_dir }}
