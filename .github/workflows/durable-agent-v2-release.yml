name: Durable Agent V2 受保护发布与回滚

"on":
  workflow_dispatch:
    inputs:
      action:
        description: 选择受保护发布、回滚或具名失败锁清理
        required: true
        type: choice
        options:
          - route_off_release
          - allowlist_release
          - rollback
          - cleanup_failed_transaction
      workflow_trusted_commit:
        description: dispatch 时 main HEAD 的精确 40 位提交
        required: true
        type: string
      ssh_attestation_run_id:
        description: SSH release attestation producer 的精确 run ID
        required: true
        type: string
      ssh_attestation_run_attempt:
        description: SSH release attestation producer 的精确 run attempt
        required: true
        type: string
      ssh_attestation_sha256:
        description: ssh-release-attestation.json 的精确 SHA-256
        required: true
        type: string
      bootstrap_attestation_run_id:
        description: release bootstrap attestation producer 的精确 run ID
        required: true
        type: string
      bootstrap_attestation_run_attempt:
        description: release bootstrap attestation producer 的精确 run attempt
        required: true
        type: string
      bootstrap_attestation_sha256:
        description: release-bootstrap-attestation.json 的精确 SHA-256
        required: true
        type: string
      canary_user_id:
        description: 发布时精确单一稳定用户 ID；rollback/cleanup 留空
        required: false
        default: ""
        type: string
      canary_novel_id:
        description: 发布时精确单一隔离小说 ID；rollback/cleanup 留空
        required: false
        default: ""
        type: string
      development_candidate_run_id:
        description: 发布时 v2 candidate evidence producer 的精确 run ID
        required: false
        default: ""
        type: string
      development_candidate_run_attempt:
        description: 发布时 v2 candidate evidence producer 的精确 run attempt（必须为 1）
        required: false
        default: ""
        type: string
      development_migration_qualification_run_id:
        description: 发布时 v2 migration qualification producer 的精确 run ID
        required: false
        default: ""
        type: string
      development_migration_qualification_run_attempt:
        description: 发布时 v2 migration qualification producer 的精确 run attempt（必须为 1）
        required: false
        default: ""
        type: string
      development_migration_qualification_source_commit:
        description: v2 migration qualification producer 的精确 main head commit
        required: false
        default: ""
        type: string
      release_manifest_run_id:
        description: rollback 时原 release manifest artifact 的 run ID
        required: false
        default: ""
        type: string
      release_manifest_sha256:
        description: rollback 时原 release-manifest.json 的 SHA-256
        required: false
        default: ""
        type: string
      failed_lock_id:
        description: cleanup 时精确 64 位失败锁 ID
        required: false
        default: ""
        type: string
      failed_lock_owner_run_id:
        description: cleanup 时原 owner GitHub run ID
        required: false
        default: ""
        type: string
      failed_lock_owner_run_attempt:
        description: cleanup 时原 owner GitHub run attempt
        required: false
        default: ""
        type: string
      failed_lock_owner_action:
        description: cleanup 时原 owner action
        required: false
        default: ""
        type: string
      failed_lock_owner_workflow_commit:
        description: cleanup 时原 owner workflow trusted commit
        required: false
        default: ""
        type: string
      failed_lock_owner_target_commit:
        description: cleanup 时原 owner target release commit
        required: false
        default: ""
        type: string
      failed_lock_owner_control_bundle_sha256:
        description: cleanup 时原 owner control bundle SHA-256
        required: false
        default: ""
        type: string
      failed_lock_cleanup_confirm:
        description: cleanup-failed-release:<lockId>
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      workflow_commit: ${{ steps.validate.outputs.workflow_commit }}
      canary_scope_sha256: ${{ steps.scope.outputs.canary_scope_sha256 }}
    steps:
      - name: 可信 context 前置门禁（禁止 checkout 与仓库脚本）
        id: validate
        shell: bash
        env:
          INPUT_WORKFLOW_COMMIT: ${{ inputs.workflow_trusted_commit }}
          RELEASE_ACTION: ${{ inputs.action }}
          SSH_ATTESTATION_RUN_ID: ${{ inputs.ssh_attestation_run_id }}
          SSH_ATTESTATION_RUN_ATTEMPT: ${{ inputs.ssh_attestation_run_attempt }}
          SSH_ATTESTATION_SHA256: ${{ inputs.ssh_attestation_sha256 }}
          BOOTSTRAP_ATTESTATION_RUN_ID: ${{ inputs.bootstrap_attestation_run_id }}
          BOOTSTRAP_ATTESTATION_RUN_ATTEMPT: ${{ inputs.bootstrap_attestation_run_attempt }}
          BOOTSTRAP_ATTESTATION_SHA256: ${{ inputs.bootstrap_attestation_sha256 }}
          DEVELOPMENT_CANDIDATE_RUN_ID: ${{ inputs.development_candidate_run_id }}
          DEVELOPMENT_CANDIDATE_RUN_ATTEMPT: ${{ inputs.development_candidate_run_attempt }}
          DEVELOPMENT_QUALIFICATION_RUN_ID: ${{ inputs.development_migration_qualification_run_id }}
          DEVELOPMENT_QUALIFICATION_RUN_ATTEMPT: ${{ inputs.development_migration_qualification_run_attempt }}
          DEVELOPMENT_QUALIFICATION_SOURCE_COMMIT: ${{ inputs.development_migration_qualification_source_commit }}
          RELEASE_MANIFEST_RUN_ID: ${{ inputs.release_manifest_run_id }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          CANARY_USER_ID: ${{ inputs.canary_user_id }}
          CANARY_NOVEL_ID: ${{ inputs.canary_novel_id }}
          FAILED_LOCK_ID: ${{ inputs.failed_lock_id }}
          FAILED_LOCK_CLEANUP_CONFIRM: ${{ inputs.failed_lock_cleanup_confirm }}
          FAILED_LOCK_OWNER_RUN_ID: ${{ inputs.failed_lock_owner_run_id }}
          FAILED_LOCK_OWNER_RUN_ATTEMPT: ${{ inputs.failed_lock_owner_run_attempt }}
          FAILED_LOCK_OWNER_ACTION: ${{ inputs.failed_lock_owner_action }}
          FAILED_LOCK_OWNER_WORKFLOW_COMMIT: ${{ inputs.failed_lock_owner_workflow_commit }}
          FAILED_LOCK_OWNER_TARGET_COMMIT: ${{ inputs.failed_lock_owner_target_commit }}
          FAILED_LOCK_OWNER_CONTROL_BUNDLE_SHA256: ${{ inputs.failed_lock_owner_control_bundle_sha256 }}
        run: |
          set -euo pipefail
          require_positive_decimal() {
            case "$1" in
              ""|0*|*[!0-9]*) exit 1 ;;
            esac
          }
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          case "$INPUT_WORKFLOW_COMMIT" in
            ""|*[!0-9a-f]*) exit 1 ;;
          esac
          test "${#INPUT_WORKFLOW_COMMIT}" -eq 40
          test "$INPUT_WORKFLOW_COMMIT" = "$GITHUB_SHA"
          for producer_number in "$SSH_ATTESTATION_RUN_ID" \
            "$SSH_ATTESTATION_RUN_ATTEMPT" "$BOOTSTRAP_ATTESTATION_RUN_ID" \
            "$BOOTSTRAP_ATTESTATION_RUN_ATTEMPT"
          do
            require_positive_decimal "$producer_number"
          done
          for attestation_sha in "$SSH_ATTESTATION_SHA256" \
            "$BOOTSTRAP_ATTESTATION_SHA256"
          do
            case "$attestation_sha" in
              ""|*[!0-9a-f]*) exit 1 ;;
            esac
            test "${#attestation_sha}" -eq 64
          done
          case "$RELEASE_ACTION" in
            route_off_release|allowlist_release)
              require_positive_decimal "$DEVELOPMENT_CANDIDATE_RUN_ID"
              case "$DEVELOPMENT_CANDIDATE_RUN_ATTEMPT" in
                1) ;;
                *) exit 1 ;;
              esac
              require_positive_decimal "$DEVELOPMENT_QUALIFICATION_RUN_ID"
              case "$DEVELOPMENT_QUALIFICATION_RUN_ATTEMPT" in
                1) ;;
                *) exit 1 ;;
              esac
              case "$DEVELOPMENT_QUALIFICATION_SOURCE_COMMIT" in
                ""|*[!0-9a-f]*) exit 1 ;;
              esac
              test "${#DEVELOPMENT_QUALIFICATION_SOURCE_COMMIT}" -eq 40
              test -n "$CANARY_USER_ID"
              test -n "$CANARY_NOVEL_ID"
              test -z "$RELEASE_MANIFEST_RUN_ID"
              test -z "$RELEASE_MANIFEST_SHA256"
              ;;
            rollback)
              require_positive_decimal "$RELEASE_MANIFEST_RUN_ID"
              case "$RELEASE_MANIFEST_SHA256" in
                ""|*[!0-9a-f]*) exit 1 ;;
              esac
              test "${#RELEASE_MANIFEST_SHA256}" -eq 64
              test -z "$DEVELOPMENT_CANDIDATE_RUN_ID"
              test -z "$DEVELOPMENT_CANDIDATE_RUN_ATTEMPT"
              test -z "$DEVELOPMENT_QUALIFICATION_RUN_ID"
              test -z "$DEVELOPMENT_QUALIFICATION_RUN_ATTEMPT"
              test -z "$DEVELOPMENT_QUALIFICATION_SOURCE_COMMIT"
              test -z "$CANARY_USER_ID"
              test -z "$CANARY_NOVEL_ID"
              ;;
            cleanup_failed_transaction)
              case "$FAILED_LOCK_ID" in
                ""|*[!0-9a-f]*) exit 1 ;;
              esac
              test "${#FAILED_LOCK_ID}" -eq 64
              test "$FAILED_LOCK_CLEANUP_CONFIRM" = \
                "cleanup-failed-release:$FAILED_LOCK_ID"
              require_positive_decimal "$FAILED_LOCK_OWNER_RUN_ID"
              require_positive_decimal "$FAILED_LOCK_OWNER_RUN_ATTEMPT"
              case "$FAILED_LOCK_OWNER_ACTION" in
                route_off_release|allowlist_release|rollback) ;;
                *) exit 1 ;;
              esac
              for owner_commit in "$FAILED_LOCK_OWNER_WORKFLOW_COMMIT" \
                "$FAILED_LOCK_OWNER_TARGET_COMMIT"
              do
                case "$owner_commit" in ""|*[!0-9a-f]*) exit 1 ;; esac
                test "${#owner_commit}" -eq 40
              done
              case "$FAILED_LOCK_OWNER_CONTROL_BUNDLE_SHA256" in
                ""|*[!0-9a-f]*) exit 1 ;;
              esac
              test "${#FAILED_LOCK_OWNER_CONTROL_BUNDLE_SHA256}" -eq 64
              test -z "$DEVELOPMENT_CANDIDATE_RUN_ID"
              test -z "$DEVELOPMENT_CANDIDATE_RUN_ATTEMPT"
              test -z "$DEVELOPMENT_QUALIFICATION_RUN_ID"
              test -z "$DEVELOPMENT_QUALIFICATION_RUN_ATTEMPT"
              test -z "$DEVELOPMENT_QUALIFICATION_SOURCE_COMMIT"
              test -z "$CANARY_USER_ID"
              test -z "$CANARY_NOVEL_ID"
              ;;
            *) exit 1 ;;
          esac
          printf 'workflow_commit=%s\n' "$INPUT_WORKFLOW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 复验 checkout、origin/main 与 CLI commit
        env:
          WORKFLOW_TRUSTED_COMMIT: ${{ steps.validate.outputs.workflow_commit }}
          TARGET_RELEASE_COMMIT: ${{ steps.validate.outputs.workflow_commit }}
          CLI_COMMIT: ${{ steps.validate.outputs.workflow_commit }}
        run: sh scripts/durable-agent-v2-release.sh source-guard

      - name: 计算精确 canary 交集 scope
        id: scope
        if: inputs.action == 'route_off_release' || inputs.action == 'allowlist_release'
        shell: bash
        env:
          CANARY_USER_ID: ${{ inputs.canary_user_id }}
          CANARY_NOVEL_ID: ${{ inputs.canary_novel_id }}
        run: |
          set -euo pipefail
          scope="$(python3 scripts/durable_agent_v2_development_evidence.py \
            scope-fingerprint --user-id "$CANARY_USER_ID" \
            --novel-id "$CANARY_NOVEL_ID")"
          printf 'canary_scope_sha256=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  candidate_validation:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev
      - name: 受保护发布控制面本地验证
        shell: bash
        env:
          WORKFLOW_TRUSTED_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          TARGET_RELEASE_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          CLI_COMMIT: ${{ needs.source.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          sh scripts/durable-agent-v2-release.sh source-guard
          sh -n scripts/durable-agent-v2-release.sh
          sh -n scripts/deploy-production.sh
          sh -n scripts/upload-durable-agent-v2-release-manifest.sh
          bash -n scripts/upload-durable-agent-v2-control-bundle.sh
          uv run ruff check \
            scripts/durable_agent_v2_control_bundle.py \
            scripts/durable_agent_v2_release_manifest.py \
            scripts/durable_agent_v2_release_receipt.py \
            scripts/durable_agent_v2_development_evidence.py \
            scripts/durable_agent_v2_development_evidence_v2.py \
            scripts/durable_agent_v2_development_producer.py \
            scripts/durable_agent_v2_development_consumer.py \
            scripts/durable_agent_release_trust.py \
            scripts/durable_agent_release_broker.py \
            scripts/github_api_evidence.py \
            scripts/verify_github_environment_policy.py \
            scripts/verify_github_workflow_run_provenance.py \
            tests/architecture/test_durable_agent_v2_release_workflow.py \
            tests/architecture/test_durable_agent_release_trust_root.py
          uv run pytest -q \
            tests/architecture/test_durable_agent_v2_release_workflow.py \
            tests/architecture/test_durable_agent_release_trust_root.py

  development_evidence:
    if: inputs.action == 'route_off_release' || inputs.action == 'allowlist_release'
    needs:
      - source
      - candidate_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: development
    concurrency:
      group: durable-agent-v2-development-${{ needs.source.outputs.workflow_commit }}
      cancel-in-progress: false
    outputs:
      candidate_evidence_sha256: ${{ steps.semantic.outputs.candidate_evidence_sha256 }}
      image_provenance_sha256: ${{ steps.semantic.outputs.image_provenance_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 只采集 development environment 与两个 producer 的外部 GitHub API 事实
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ENVIRONMENT_POLICY_AUDIT_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.development_candidate_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.development_migration_qualification_run_id }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN"
          api_dir="$RUNNER_TEMP/durable-agent-v2-development-consumer-api"
          mkdir "$api_dir"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development" \
            > "$api_dir/environment.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/deployment-branch-policies?per_page=100" \
            > "$api_dir/branch-policies.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/secrets?per_page=100" \
            > "$api_dir/secrets.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/development/variables?per_page=100" \
            > "$api_dir/variables.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$api_dir/candidate-run.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            > "$api_dir/qualification-run.json"
          chmod 600 "$api_dir"/*.json
      - name: 无令牌复验 development environment 外部策略
        shell: bash
        run: |
          set -euo pipefail
          api_dir="$RUNNER_TEMP/durable-agent-v2-development-consumer-api"
          python3 scripts/durable_agent_v2_development_producer.py \
            verify-environment-policy \
            --environment-json "$api_dir/environment.json" \
            --branch-policies-json "$api_dir/branch-policies.json" \
            --secrets-json "$api_dir/secrets.json" \
            --variables-json "$api_dir/variables.json"
      - name: Checkout qualification 自身 source commit（只读事实）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.development_migration_qualification_source_commit }}
          path: development-qualification-source
          fetch-depth: 1
          persist-credentials: false
      - name: 下载 v2 candidate evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-candidate-evidence
          path: ${{ runner.temp }}/durable-agent-v2-candidate-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.development_candidate_run_id }}
      - name: 下载 v2 development image provenance
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-development-images
          path: ${{ runner.temp }}/durable-agent-v2-development-images
          github-token: ${{ github.token }}
          run-id: ${{ inputs.development_candidate_run_id }}
      - name: 下载开发环境验证过的目标镜像
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-target-images
          path: ${{ runner.temp }}/durable-agent-v2-target-images
          github-token: ${{ github.token }}
          run-id: ${{ inputs.development_candidate_run_id }}
      - name: 下载 v2 migration qualification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-migration-qualification
          path: ${{ runner.temp }}/durable-agent-v2-migration-qualification
          github-token: ${{ github.token }}
          run-id: ${{ inputs.development_migration_qualification_run_id }}
      - name: 复验实际镜像与 v2 qualification/candidate 全部语义
        id: semantic
        shell: bash
        env:
          TARGET_RELEASE_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          WORKFLOW_TRUSTED_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          CLI_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.development_candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.development_candidate_run_attempt }}
          QUALIFICATION_RUN_ID: ${{ inputs.development_migration_qualification_run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ inputs.development_migration_qualification_run_attempt }}
          QUALIFICATION_SOURCE_COMMIT: ${{ inputs.development_migration_qualification_source_commit }}
        run: |
          set -euo pipefail
          umask 077
          api_dir="$RUNNER_TEMP/durable-agent-v2-development-consumer-api"
          candidate_dir="$RUNNER_TEMP/durable-agent-v2-candidate-evidence"
          qualification_dir="$RUNNER_TEMP/durable-agent-v2-migration-qualification"
          provenance_dir="$RUNNER_TEMP/durable-agent-v2-development-images"
          images_dir="$RUNNER_TEMP/durable-agent-v2-target-images"
          source_tree_manifest="$RUNNER_TEMP/target-source-tree.manifest"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$TARGET_RELEASE_COMMIT"
          test "$(git -C "$GITHUB_WORKSPACE/development-qualification-source" \
            rev-parse HEAD)" = "$QUALIFICATION_SOURCE_COMMIT"
          printf 'target %s\0' "$TARGET_RELEASE_COMMIT" \
            > "$source_tree_manifest"
          git -C "$GITHUB_WORKSPACE" ls-tree -rz --full-tree \
            "$TARGET_RELEASE_COMMIT" >> "$source_tree_manifest"
          chmod 600 "$source_tree_manifest"
          python3 - "$images_dir" <<'PY'
          import os
          import stat
          import sys

          root = sys.argv[1]
          expected = {
              "SHA256SUMS",
              "target-images.snapshot",
              "target-images.tar.gz",
          }
          try:
              root_metadata = os.lstat(root)
              if not stat.S_ISDIR(root_metadata.st_mode):
                  raise ValueError("目标镜像 artifact 根目录不是普通目录")
              with os.scandir(root) as entries:
                  observed = {}
                  for entry in entries:
                      if entry.name in observed:
                          raise ValueError("目标镜像 artifact 成员重名")
                      observed[entry.name] = entry.stat(follow_symlinks=False)
          except OSError as error:
              raise SystemExit(f"目标镜像 artifact 无法安全枚举：{error}") from error
          if set(observed) != expected:
              raise SystemExit("目标镜像 artifact 成员白名单不匹配")
          for name, metadata in observed.items():
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                  raise SystemExit(f"目标镜像 artifact 成员不是单链接普通文件：{name}")
          PY
          chmod 700 "$candidate_dir" "$qualification_dir" "$provenance_dir" \
            "$images_dir"
          find "$candidate_dir" "$qualification_dir" "$provenance_dir" \
            "$images_dir" -type f -exec chmod 600 {} +
          checksum_files="$(sed -n \
            's/^[0-9a-f]\{64\}  //p' "$images_dir/SHA256SUMS" | sort)"
          expected_checksums="$(printf '%s\n' target-images.snapshot \
            target-images.tar.gz | sort)"
          test "$checksum_files" = "$expected_checksums"
          test "$(wc -l < "$images_dir/SHA256SUMS" | tr -d ' ')" = 2
          (cd "$images_dir" && sha256sum --strict --check SHA256SUMS)
          gzip -dc "$images_dir/target-images.tar.gz" | docker load
          sh scripts/durable-agent-v2-release.sh target-snapshot \
            > "$images_dir/target-images.current"
          chmod 600 "$images_dir/target-images.current"
          cmp "$images_dir/target-images.snapshot" "$images_dir/target-images.current"
          verified="$(python3 scripts/durable_agent_v2_development_consumer.py \
            --candidate-dir "$candidate_dir" \
            --candidate-run-json "$api_dir/candidate-run.json" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --qualification-dir "$qualification_dir" \
            --qualification-run-json "$api_dir/qualification-run.json" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --qualification-run-attempt "$QUALIFICATION_RUN_ATTEMPT" \
            --qualification-source-root \
              "$GITHUB_WORKSPACE/development-qualification-source" \
            --qualification-source-commit "$QUALIFICATION_SOURCE_COMMIT" \
            --images-dir "$provenance_dir" \
            --target-images-snapshot "$images_dir/target-images.current" \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-tree-manifest "$source_tree_manifest" \
            --variables-json "$api_dir/variables.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-target-commit "$TARGET_RELEASE_COMMIT")"
          case "$verified" in
            development-v2-consumer-ok:*) ;;
            *) exit 1 ;;
          esac
          evidence_identity="${verified#development-v2-consumer-ok:}"
          candidate_sha="${evidence_identity%%:*}"
          image_sha="${evidence_identity#*:}"
          test "$candidate_sha" != "$image_sha"
          case "$candidate_sha" in ""|*[!0-9a-f]*) exit 1 ;; esac
          case "$image_sha" in ""|*[!0-9a-f]*) exit 1 ;; esac
          test "${#candidate_sha}" -eq 64
          test "${#image_sha}" -eq 64
          printf 'candidate_evidence_sha256=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'image_provenance_sha256=%s\n' "$image_sha" >> "$GITHUB_OUTPUT"
      - name: 转存本次 release workflow 的已复验 v2 开发输入
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-agent-v2-verified-development-v2-input
          path: |
            ${{ runner.temp }}/durable-agent-v2-candidate-evidence
            ${{ runner.temp }}/durable-agent-v2-migration-qualification
            ${{ runner.temp }}/durable-agent-v2-development-images
            ${{ runner.temp }}/durable-agent-v2-target-images
          if-no-files-found: error
          retention-days: 7

  rollback_manifest:
    if: inputs.action == 'rollback'
    needs:
      - source
      - candidate_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      target_release_commit: ${{ steps.manifest.outputs.target_release_commit }}
      rollback_source_release_commit: ${{ steps.manifest.outputs.rollback_source_release_commit }}
      canary_scope_sha256: ${{ steps.manifest.outputs.canary_scope_sha256 }}
      producer_workflow_commit: ${{ steps.manifest.outputs.producer_workflow_commit }}
      producer_run_attempt: ${{ steps.manifest.outputs.producer_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-release-manifest
          path: ${{ runner.temp }}/durable-agent-v2-rollback-manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_manifest_run_id }}
      - name: 先按 artifact 自身 SHA 做 root-independent 复验
        id: manifest
        shell: bash
        env:
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
        run: |
          set -euo pipefail
          manifest_dir="$RUNNER_TEMP/durable-agent-v2-rollback-manifest"
          chmod 700 "$manifest_dir"
          chmod 600 "$manifest_dir/release-manifest.json" "$manifest_dir/SHA256SUMS"
          python3 scripts/durable_agent_v2_release_manifest.py verify \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256"
          target="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field target-release-commit)"
          rollback_source="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field rollback-source-release-commit)"
          scope="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field canary-scope-sha256)"
          producer_workflow_commit="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field workflow-trusted-commit)"
          producer_run_id="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field producer-run-id)"
          producer_run_attempt="$(python3 scripts/durable_agent_v2_release_manifest.py read \
            --manifest-dir "$manifest_dir" \
            --expected-artifact-sha256 "$MANIFEST_SHA256" \
            --field producer-run-attempt)"
          test "$producer_run_id" = "${{ inputs.release_manifest_run_id }}"
          printf 'target_release_commit=%s\n' "$target" >> "$GITHUB_OUTPUT"
          printf 'rollback_source_release_commit=%s\n' "$rollback_source" >> "$GITHUB_OUTPUT"
          printf 'canary_scope_sha256=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'producer_workflow_commit=%s\n' "$producer_workflow_commit" >> "$GITHUB_OUTPUT"
          printf 'producer_run_attempt=%s\n' "$producer_run_attempt" >> "$GITHUB_OUTPUT"
      - name: 复验 rollback artifact producer run 外部来源
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.release_manifest_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.manifest.outputs.producer_run_attempt }}
          PRODUCER_WORKFLOW_COMMIT: ${{ steps.manifest.outputs.producer_workflow_commit }}
        run: |
          set -euo pipefail
          umask 077
          run_json="$RUNNER_TEMP/rollback-manifest-producer-run.json"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > "$run_json"
          chmod 600 "$run_json"
          python3 scripts/verify_github_workflow_run_provenance.py \
            --run-json "$run_json" --expected-run-id "$PRODUCER_RUN_ID" \
            --expected-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-head-sha "$PRODUCER_WORKFLOW_COMMIT" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-path '.github/workflows/durable-agent-v2-release.yml'
      - name: Checkout manifest 自身 target commit（只读事实）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.manifest.outputs.target_release_commit }}
          path: manifest-target-source
          fetch-depth: 1
      - name: 按旧 manifest 自身 target commit 复验冻结事实
        env:
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
        run: |
          python3 scripts/durable_agent_v2_release_manifest.py verify \
            --repository-root "$GITHUB_WORKSPACE/manifest-target-source" \
            --manifest-dir "$RUNNER_TEMP/durable-agent-v2-rollback-manifest" \
            --expected-target-commit "${{ steps.manifest.outputs.target_release_commit }}" \
            --expected-artifact-sha256 "$MANIFEST_SHA256"
      - name: 转存已复验旧 manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-agent-v2-rollback-input
          path: ${{ runner.temp }}/durable-agent-v2-rollback-manifest
          if-no-files-found: error
          retention-days: 7

  production:
    if: >-
      always() &&
      needs.source.result == 'success' &&
      needs.candidate_validation.result == 'success' &&
      (
        inputs.action == 'cleanup_failed_transaction' ||
        ((inputs.action == 'route_off_release' || inputs.action == 'allowlist_release') && needs.development_evidence.result == 'success') ||
        (inputs.action == 'rollback' && needs.rollback_manifest.result == 'success')
      )
    needs:
      - source
      - candidate_validation
      - development_evidence
      - rollback_manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 复验 production 当前 trusted checkout
        shell: bash
        env:
          WORKFLOW_TRUSTED_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          TARGET_RELEASE_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          CLI_COMMIT: ${{ needs.source.outputs.workflow_commit }}
        run: sh scripts/durable-agent-v2-release.sh source-guard

      - name: 按精确 producer run 下载 SSH release attestation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-ssh-release-attestation
          path: ${{ runner.temp }}/durable-agent-v2-release-trust/ssh-attestation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ssh_attestation_run_id }}

      - name: 按同一 producer run 下载固定 SSH evidence bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-ssh-release-evidence
          path: ${{ runner.temp }}/durable-agent-v2-release-trust/ssh-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ssh_attestation_run_id }}

      - name: 按精确 producer run 下载 release bootstrap attestation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: durable-agent-v2-release-bootstrap-attestation
          path: ${{ runner.temp }}/durable-agent-v2-release-trust/bootstrap-attestation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.bootstrap_attestation_run_id }}

      - name: 用当前 trusted checkout 收紧下载 artifact 权限与文件白名单
        shell: bash
        run: |
          set -euo pipefail
          trust_root="$RUNNER_TEMP/durable-agent-v2-release-trust"
          python3 scripts/durable_agent_release_trust.py normalize-download \
            --kind ssh-attestation --directory "$trust_root/ssh-attestation"
          python3 scripts/durable_agent_release_trust.py normalize-download \
            --kind ssh-evidence --directory "$trust_root/ssh-evidence"
          python3 scripts/durable_agent_release_trust.py normalize-download \
            --kind bootstrap-attestation --directory "$trust_root/bootstrap-attestation"

      - name: production approval 后只采集外部 GitHub API 事实
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ENVIRONMENT_POLICY_AUDIT_TOKEN }}
          SSH_ATTESTATION_RUN_ID: ${{ inputs.ssh_attestation_run_id }}
          BOOTSTRAP_ATTESTATION_RUN_ID: ${{ inputs.bootstrap_attestation_run_id }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN"
          live_dir="$RUNNER_TEMP/durable-agent-v2-live-github-api-evidence"
          mkdir "$live_dir"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY" \
            > "$live_dir/repository.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/production" \
            > "$live_dir/environment.json"
          gh api --method GET --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" \
            > "$live_dir/branch-policies.pages.json"
          gh api --method GET --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/production/secrets?per_page=100" \
            > "$live_dir/environment-secrets.pages.json"
          gh api --method GET --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" \
            > "$live_dir/repository-secrets.pages.json"
          owner_type="$(jq -er \
            '.owner.type | select(. == "User" or . == "Organization")' \
            "$live_dir/repository.json")"
          case "$owner_type" in
            Organization)
              gh api --method GET --paginate --slurp \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "orgs/$GITHUB_REPOSITORY_OWNER/actions/secrets?per_page=100" \
                > "$live_dir/organization-secrets.pages.json"
              ;;
            User) ;;
            *) exit 1 ;;
          esac
          gh api --method GET --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/environments/production/variables?per_page=100" \
            > "$live_dir/variables.pages.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SSH_ATTESTATION_RUN_ID" \
            > "$live_dir/ssh-run.json"
          gh api --method GET \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_ATTESTATION_RUN_ID" \
            > "$live_dir/bootstrap-run.json"
          chmod 600 "$live_dir"/*.json

      - name: 固定写入 production known_hosts secret（不执行仓库脚本）
        shell: bash
        env:
          RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.DURABLE_AGENT_V2_RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_SSH_KNOWN_HOSTS"
          actual_known_hosts="$RUNNER_TEMP/durable-agent-v2-release-trust/production-known-hosts"
          test ! -e "$actual_known_hosts"
          printf '%s' "$RELEASE_SSH_KNOWN_HOSTS" > "$actual_known_hosts"
          chmod 600 "$actual_known_hosts"

      - name: 无 secret 规范化并复验全部 production 信任事实
        shell: bash
        env:
          WORKFLOW_TRUSTED_COMMIT: ${{ needs.source.outputs.workflow_commit }}
          SSH_ATTESTATION_RUN_ID: ${{ inputs.ssh_attestation_run_id }}
          SSH_ATTESTATION_RUN_ATTEMPT: ${{ inputs.ssh_attestation_run_attempt }}
          SSH_ATTESTATION_SHA256: ${{ inputs.ssh_attestation_sha256 }}
          BOOTSTRAP_ATTESTATION_RUN_ID: ${{ inputs.bootstrap_attestation_run_id }}
          BOOTSTRAP_ATTESTATION_RUN_ATTEMPT: ${{ inputs.bootstrap_attestation_run_attempt }}
          BOOTSTRAP_ATTESTATION_SHA256: ${{ inputs.bootstrap_attestation_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          trust_root="$RUNNER_TEMP/durable-agent-v2-release-trust"
          live_dir="$RUNNER_TEMP/durable-agent-v2-live-github-api-evidence"
          canonical_dir="$live_dir/canonical"
          mkdir "$canonical_dir"
          set -- normalize-pages \
            --repository-json "$live_dir/repository.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --branch-policies-pages-json "$live_dir/branch-policies.pages.json" \
            --environment-secrets-pages-json "$live_dir/environment-secrets.pages.json" \
            --repository-secrets-pages-json "$live_dir/repository-secrets.pages.json" \
            --variables-pages-json "$live_dir/variables.pages.json" \
            --output-directory "$canonical_dir"
          if [ -e "$live_dir/organization-secrets.pages.json" ]; then
            set -- "$@" --organization-secrets-pages-json \
              "$live_dir/organization-secrets.pages.json"
          fi
          python3 scripts/verify_github_environment_policy.py "$@"
          policy_output="$(python3 scripts/verify_github_environment_policy.py \
            --repository-json "$live_dir/repository.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --environment-json "$live_dir/environment.json" \
            --branch-policies-json "$canonical_dir/branch-policies.json" \
            --secrets-json "$canonical_dir/environment-secrets.json" \
            --repository-secrets-json "$canonical_dir/repository-secrets.json" \
            --organization-secrets-json "$canonical_dir/organization-secrets.json" \
            --variables-json "$canonical_dir/variables.json")"
          printf '%s\n' "$policy_output"
          release_server_host="$(printf '%s\n' "$policy_output" | \
            sed -n 's/^releaseServerHost=//p')"
          release_server_port="$(printf '%s\n' "$policy_output" | \
            sed -n 's/^releaseServerPort=//p')"
          release_server_user="$(printf '%s\n' "$policy_output" | \
            sed -n 's/^releaseServerUser=//p')"
          test -n "$release_server_host"
          test -n "$release_server_port"
          test -n "$release_server_user"
          python3 scripts/verify_github_workflow_run_provenance.py \
            --run-json "$live_dir/ssh-run.json" \
            --expected-run-id "$SSH_ATTESTATION_RUN_ID" \
            --expected-run-attempt "$SSH_ATTESTATION_RUN_ATTEMPT" \
            --expected-head-sha "$WORKFLOW_TRUSTED_COMMIT" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-path \
              '.github/workflows/durable-agent-v2-ssh-release-attestation.yml'
          python3 scripts/verify_github_workflow_run_provenance.py \
            --run-json "$live_dir/bootstrap-run.json" \
            --expected-run-id "$BOOTSTRAP_ATTESTATION_RUN_ID" \
            --expected-run-attempt "$BOOTSTRAP_ATTESTATION_RUN_ATTEMPT" \
            --expected-head-sha "$WORKFLOW_TRUSTED_COMMIT" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-path \
              '.github/workflows/durable-agent-v2-release-bootstrap.yml'
          python3 scripts/durable_agent_release_trust.py verify \
            --attestation-dir "$trust_root/ssh-attestation" \
            --expected-sha256 "$SSH_ATTESTATION_SHA256" \
            --github-run-json "$live_dir/ssh-run.json" \
            --ssh-evidence-dir "$trust_root/ssh-evidence" \
            --environment-secrets-json "$canonical_dir/environment-secrets.json" \
            --repository-secrets-json "$canonical_dir/repository-secrets.json" \
            --organization-secrets-json "$canonical_dir/organization-secrets.json" \
            --expected-known-hosts-file "$trust_root/production-known-hosts" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-environment production \
            --expected-host "$release_server_host" \
            --expected-port "$release_server_port" \
            --expected-user "$release_server_user"
          python3 scripts/durable_agent_release_trust.py verify \
            --attestation-dir "$trust_root/bootstrap-attestation" \
            --expected-sha256 "$BOOTSTRAP_ATTESTATION_SHA256" \
            --github-run-json "$live_dir/bootstrap-run.json" \
            --expected-ssh-attestation-sha256 "$SSH_ATTESTATION_SHA256" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-environment production \
            --expected-host "$release_server_host" \
            --expected-port "$release_server_port" \
            --expected-user "$release_server_user"

      - name: sealed genesis 与真正流式双角色 broker 未接线，固定拒绝生产执行
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'release-trust-runtime-integration:error:streaming-broker-and-sealed-genesis-not-implemented' \
            >&2
          exit 1
