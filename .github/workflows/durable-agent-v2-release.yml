          VERIFIED_DRAIN_SHA256: ${{ steps.prepare_release.outputs.verified_drain_sha256 }}
          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
        run: |
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q RELEASE_ACTION=rollback RELEASE_MANIFEST_SHA256=%q RELEASE_MANIFEST_DIR=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q VERIFIED_DRAIN_SHA256=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q rollback-postflight' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$TARGET_RELEASE_COMMIT" \
            "$RELEASE_MANIFEST_SHA256" "$RELEASE_MANIFEST_DIR" \
            "$DURABLE_AGENT_RELEASE_LOCK_ID" "$VERIFIED_DRAIN_SHA256" \
            "$CONTROL_BUNDLE_DIR" "$CONTROL_BUNDLE_SHA256" \
            "$WORKFLOW_TRUSTED_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"

      - name: 统一 runtime postflight
        if: inputs.action != 'cleanup_failed_transaction' && inputs.action != 'allowlist_release'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_RELEASE_COMMIT: ${{ steps.metadata.outputs.target_release_commit }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.action == 'rollback' && inputs.release_manifest_sha256 || steps.create_manifest.outputs.manifest_sha256 }}
          RELEASE_MANIFEST_DIR: ${{ inputs.action == 'rollback' && steps.upload_rollback_manifest.outputs.remote_dir || steps.upload_release_manifest.outputs.remote_dir }}
          DURABLE_AGENT_RELEASE_LOCK_ID: ${{ steps.lock.outputs.lock_id }}
          VERIFIED_DRAIN_SHA256: ${{ steps.prepare_release.outputs.verified_drain_sha256 }}
          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
        run: |
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q RELEASE_ACTION=%q RELEASE_MANIFEST_SHA256=%q RELEASE_MANIFEST_DIR=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q VERIFIED_DRAIN_SHA256=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q transaction-postflight' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$TARGET_RELEASE_COMMIT" \
            "$RELEASE_ACTION" "$RELEASE_MANIFEST_SHA256" "$RELEASE_MANIFEST_DIR" \
            "$DURABLE_AGENT_RELEASE_LOCK_ID" "$VERIFIED_DRAIN_SHA256" \
            "$CONTROL_BUNDLE_DIR" "$CONTROL_BUNDLE_SHA256" \
            "$WORKFLOW_TRUSTED_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"

      - name: 全部 postflight 通过后提交并释放服务器锁
        if: inputs.action != 'cleanup_failed_transaction' && inputs.action != 'allowlist_release'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_RELEASE_COMMIT: ${{ steps.metadata.outputs.target_release_commit }}
          DURABLE_AGENT_RELEASE_LOCK_ID: ${{ steps.lock.outputs.lock_id }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.action == 'rollback' && inputs.release_manifest_sha256 || steps.create_manifest.outputs.manifest_sha256 }}
          RELEASE_MANIFEST_DIR: ${{ inputs.action == 'rollback' && steps.upload_rollback_manifest.outputs.remote_dir || steps.upload_release_manifest.outputs.remote_dir }}
          VERIFIED_DRAIN_SHA256: ${{ steps.prepare_release.outputs.verified_drain_sha256 }}
          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
        run: |
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q RELEASE_ACTION=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q RELEASE_MANIFEST_SHA256=%q RELEASE_MANIFEST_DIR=%q VERIFIED_DRAIN_SHA256=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q commit-transaction' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$TARGET_RELEASE_COMMIT" \
            "$RELEASE_ACTION" "$DURABLE_AGENT_RELEASE_LOCK_ID" \
            "$RELEASE_MANIFEST_SHA256" "$RELEASE_MANIFEST_DIR" \
            "$VERIFIED_DRAIN_SHA256" "$CONTROL_BUNDLE_DIR" \
            "$CONTROL_BUNDLE_SHA256" "$WORKFLOW_TRUSTED_COMMIT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"

      - name: 失败时保留并标记服务器锁
        if: failure() && inputs.action != 'cleanup_failed_transaction'
        continue-on-error: true
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_RELEASE_COMMIT: ${{ steps.metadata.outputs.target_release_commit }}
          DURABLE_AGENT_RELEASE_LOCK_ID: ${{ steps.lock.outputs.lock_id }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.action == 'rollback' && inputs.release_manifest_sha256 || steps.create_manifest.outputs.manifest_sha256 }}
          RELEASE_MANIFEST_DIR: ${{ inputs.action == 'rollback' && steps.upload_rollback_manifest.outputs.remote_dir || steps.upload_release_manifest.outputs.remote_dir }}
          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
          CANARY_USER_ID: ${{ inputs.canary_user_id }}
          CANARY_NOVEL_ID: ${{ inputs.canary_novel_id }}
        run: |
          test -n "$DURABLE_AGENT_RELEASE_LOCK_ID" || exit 0
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q RELEASE_ACTION=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q RELEASE_MANIFEST_SHA256=%q RELEASE_MANIFEST_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q CANARY_USER_ID=%q CANARY_NOVEL_ID=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q mark-transaction-failed' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$TARGET_RELEASE_COMMIT" \
            "$RELEASE_ACTION" "$DURABLE_AGENT_RELEASE_LOCK_ID" \
            "$RELEASE_MANIFEST_SHA256" "$RELEASE_MANIFEST_DIR" \
            "$CONTROL_BUNDLE_DIR" "$CONTROL_BUNDLE_SHA256" \
            "$CANARY_USER_ID" "$CANARY_NOVEL_ID" \
            "$WORKFLOW_TRUSTED_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"

      - name: 具名清理精确失败锁
        if: inputs.action == 'cleanup_failed_transaction'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FAILED_LOCK_ID: ${{ inputs.failed_lock_id }}
          FAILED_LOCK_OWNER_RUN_ID: ${{ inputs.failed_lock_owner_run_id }}
          FAILED_LOCK_OWNER_RUN_ATTEMPT: ${{ inputs.failed_lock_owner_run_attempt }}
          FAILED_LOCK_OWNER_ACTION: ${{ inputs.failed_lock_owner_action }}
          FAILED_LOCK_OWNER_WORKFLOW_COMMIT: ${{ inputs.failed_lock_owner_workflow_commit }}
          FAILED_LOCK_OWNER_TARGET_COMMIT: ${{ inputs.failed_lock_owner_target_commit }}
          FAILED_LOCK_OWNER_CONTROL_BUNDLE_SHA256: ${{ inputs.failed_lock_owner_control_bundle_sha256 }}
          FAILED_LOCK_CLEANUP_CONFIRM: ${{ inputs.failed_lock_cleanup_confirm }}
          CONTROL_BUNDLE_DIR: ${{ steps.upload_control_bundle.outputs.remote_dir }}
          CONTROL_BUNDLE_SHA256: ${{ steps.control_bundle.outputs.bundle_sha256 }}
        run: |
          ssh_dir="$RUNNER_TEMP/inkforge-durable-v2-ssh"
          printf -v remote_command \
            'APP_DIR=%q WORKFLOW_TRUSTED_COMMIT=%q TARGET_RELEASE_COMMIT=%q DURABLE_AGENT_RELEASE_LOCK_ID=%q RELEASE_LOCK_OWNER_RUN_ID=%q RELEASE_LOCK_OWNER_RUN_ATTEMPT=%q RELEASE_LOCK_OWNER_ACTION=%q RELEASE_LOCK_OWNER_WORKFLOW_COMMIT=%q RELEASE_LOCK_OWNER_TARGET_COMMIT=%q RELEASE_LOCK_OWNER_CONTROL_BUNDLE_SHA256=%q INKFORGE_RELEASE_CLEANUP_CONFIRM=%q DURABLE_AGENT_CONTROL_BUNDLE_DIR=%q DURABLE_AGENT_CONTROL_BUNDLE_SHA256=%q GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_REF=refs/heads/main GITHUB_SHA=%q GITHUB_RUN_ID=%q GITHUB_RUN_ATTEMPT=%q INKFORGE_RELEASE_APPROVED_ENVIRONMENT=production sh %q cleanup-failed-transaction' \
            "$APP_DIR" "$WORKFLOW_TRUSTED_COMMIT" "$WORKFLOW_TRUSTED_COMMIT" \
            "$FAILED_LOCK_ID" "$FAILED_LOCK_OWNER_RUN_ID" \
            "$FAILED_LOCK_OWNER_RUN_ATTEMPT" "$FAILED_LOCK_OWNER_ACTION" \
            "$FAILED_LOCK_OWNER_WORKFLOW_COMMIT" \
            "$FAILED_LOCK_OWNER_TARGET_COMMIT" \
            "$FAILED_LOCK_OWNER_CONTROL_BUNDLE_SHA256" \
            "$FAILED_LOCK_CLEANUP_CONFIRM" "$CONTROL_BUNDLE_DIR" \
            "$CONTROL_BUNDLE_SHA256" \
            "$WORKFLOW_TRUSTED_COMMIT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CONTROL_BUNDLE_DIR/scripts/durable-agent-v2-release.sh"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o BatchMode=yes -i "$ssh_dir/deploy_key" \
            "${SERVER_USER}@${SERVER_HOST}" "$remote_command"
