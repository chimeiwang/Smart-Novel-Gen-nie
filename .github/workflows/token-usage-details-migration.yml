name: TokenUsage dev 迁移

"on":
  workflow_dispatch:
    inputs:
      action:
        description: 选择 dev 检查、生产权限检查修复或执行 dev 迁移
        required: true
        type: choice
        options:
          - inspect
          - inspect_production_access
          - repair_production_access
          - migrate_dev

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: token-usage-details-dev-migration
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      APP_DIR: ${{ vars.APP_DIR }}
      SQL_PATH: scripts/migrations/20260823_token_usage_details.sql
      SQL_SHA256: BF6817A82F74E76B8F98D356749795A1EC04BCFCED090DB3F8B463F62ABCAB93

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 准备严格 SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          test -n "$SERVER_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          printf '%s\n' "$SERVER_SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: 校验固定迁移 SQL
        shell: bash
        run: |
          set -eu
          test -f "$SQL_PATH"
          printf '%s  %s\n' "$SQL_SHA256" "$SQL_PATH" | sha256sum --check --status -

      - name: inspect
        if: inputs.action == 'inspect'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          printf -v remote_command 'bash -s -- %q %q %q' \
            "$APP_DIR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          umask 077
          app_dir=$1
          run_id=$2
          run_attempt=$3
          case "$run_id" in
            ''|*[!0-9]*) echo "运行编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "尝试编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          pgpass_file="/tmp/inkforge-token-usage-details-inspect-$run_id-$run_attempt.pgpass"
          case "$pgpass_file" in
            /tmp/inkforge-token-usage-details-inspect-[0-9]*-[0-9]*.pgpass) ;;
            *) echo "凭据临时路径不符合固定约定" >&2; exit 1 ;;
          esac
          rm -f -- "$pgpass_file"
          trap 'rm -f -- "$pgpass_file"' EXIT
          [ -n "$app_dir" ] || { echo "APP_DIR 未配置" >&2; exit 1; }
          cd -- "$app_dir"

          missing_tools=0
          for tool in psql pg_dump pg_restore sha256sum docker python3 timeout; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s: present\n' "$tool"
            else
              printf '%s: missing\n' "$tool"
              missing_tools=1
            fi
          done
          set +x
          env_file="$app_dir/.env"
          [ -r "$env_file" ] || { echo ".env: missing" >&2; exit 1; }
          database_url="$(python3 - "$env_file" "$pgpass_file" <<'PY'
          import os
          import sys
          from pathlib import Path
          from urllib.parse import parse_qsl, quote, unquote, urlsplit, urlunsplit

          SAFE_QUERY_KEYS = {"application_name", "sslmode"}

          class DatabaseUrlRejected(Exception):
              pass

          def write_private(path: str, payload: str) -> None:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as target:
                  target.write(payload)

          def escape_pgpass(value: str) -> str:
              return value.replace("\\", "\\\\").replace(":", "\\:")

          def derive_dev_database_url(path: str, pgpass_path: str) -> str:
              try:
                  matches = []
                  for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                      line = raw_line.strip()
                      if not line or line.startswith("#"):
                          continue
                      if line.startswith("DATABASE_URL="):
                          value = line[len("DATABASE_URL=") :].strip()
                          if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                              value = value[1:-1].strip()
                          matches.append(value)
                  if len(matches) != 1 or not matches[0]:
                      raise DatabaseUrlRejected("database_url_count")
                  value = matches[0]
                  normalized = (
                      "postgresql://" + value[len("postgresql+asyncpg://") :]
                      if value.startswith("postgresql+asyncpg://")
                      else value
                  )
                  try:
                      parts = urlsplit(normalized)
                  except ValueError:
                      raise DatabaseUrlRejected("url_split") from None
                  if (
                      parts.scheme != "postgresql" or not parts.netloc
                  ):
                      raise DatabaseUrlRejected("scheme_or_authority")
                  if parts.path != "/novelwriter":
                      raise DatabaseUrlRejected("source_database")
                  if parts.fragment:
                      raise DatabaseUrlRejected("fragment")
                  try:
                      query_pairs = parse_qsl(
                          parts.query, keep_blank_values=True
                      )
                  except ValueError:
                      raise DatabaseUrlRejected("query_syntax") from None
                  query_keys = [key for key, _value in query_pairs]
                  if (
                      len(query_keys) != len(set(query_keys))
                      or any(key not in SAFE_QUERY_KEYS for key in query_keys)
                  ):
                      raise DatabaseUrlRejected("query")
                  username = unquote(parts.username or "")
                  password = unquote(parts.password or "")
                  hostname = parts.hostname or ""
                  try:
                      port = parts.port or 5432
                  except ValueError:
                      raise DatabaseUrlRejected("port") from None
                  if not username or not password or not hostname:
                      raise DatabaseUrlRejected("credentials")
                  if hostname != "host.docker.internal":
                      raise DatabaseUrlRejected("source_host")
                  command_hostname = "127.0.0.1"
                  if any("\n" in value or "\r" in value for value in (username, password, hostname)):
                      raise DatabaseUrlRejected("newline")
                  pgpass = ":".join(
                      escape_pgpass(value)
                      for value in (command_hostname, str(port), "novelwriterdev", username, password)
                  ) + "\n"
                  write_private(pgpass_path, pgpass)
                  safe_netloc = f"{quote(username, safe='')}@{command_hostname}"
                  if parts.port is not None:
                      safe_netloc += f":{parts.port}"
                  return urlunsplit(
                      parts._replace(netloc=safe_netloc, path="/novelwriterdev")
                  )
              except DatabaseUrlRejected:
                  raise
              except OSError:
                  raise DatabaseUrlRejected("filesystem") from None
              except UnicodeError:
                  raise DatabaseUrlRejected("encoding") from None
              except ValueError:
                  raise DatabaseUrlRejected("url_value") from None

          try:
              parsed = derive_dev_database_url(sys.argv[1], sys.argv[2])
          except DatabaseUrlRejected as exc:
              print(f"database-url-check:{exc}", file=sys.stderr)
              raise SystemExit(1) from None
          if parsed:
              print(parsed, end="")
          else:
              raise SystemExit(1)
          PY
          )" || { echo ".env DATABASE_URL 不能安全派生 novelwriterdev" >&2; exit 1; }
          [ -s "$pgpass_file" ] || { echo "临时 pgpass 未生成" >&2; exit 1; }
          [ "$(stat -c '%a' "$pgpass_file")" = "600" ] || {
            echo "临时 pgpass 权限不正确" >&2
            exit 1
          }
          PGPASSFILE="$pgpass_file"
          export PGPASSFILE
          [ "$missing_tools" -eq 0 ] || { echo "服务器缺少必要命令" >&2; exit 1; }
          database_name="$(PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000' \
            timeout 45 psql -v ON_ERROR_STOP=1 -Atq "$database_url" \
            -c 'SELECT current_database()')" || {
              echo "novelwriterdev 只读连接检查失败" >&2
              exit 1
            }
          [ "$database_name" = "novelwriterdev" ] || {
            echo "目标数据库不是 novelwriterdev" >&2
            exit 1
          }
          for backup_root in /srv/backups/inkforge-dev /srv/backups/inkforge \
            "$app_dir/.token-usage-dev-backups"; do
            if [ -d "$backup_root" ] && [ -w "$backup_root" ]; then
              printf 'backup-root:%s:writable\n' "$backup_root"
            elif [ ! -e "$backup_root" ] && [ -d "$(dirname "$backup_root")" ] \
              && [ -w "$(dirname "$backup_root")" ]; then
              printf 'backup-root:%s:missing-parent-writable\n' "$backup_root"
            else
              printf 'backup-root:%s:not-writable\n' "$backup_root"
            fi
          done
          printf '.env: present\n'
          printf 'novelwriterdev: verified\n'
          REMOTE

      - name: inspect_production_access
        if: inputs.action == 'inspect_production_access'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          helper="scripts/token-usage-production-migration.sh"
          helper_sha="$(sha256sum "$helper" | awk '{print $1}')"
          remote_helper="/tmp/inkforge-token-usage-production-access-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          scp -q \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$helper" "$SERVER_USER@$SERVER_HOST:$remote_helper"

          printf -v remote_command 'bash -s -- %q %q %q %q' \
            "$APP_DIR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$helper_sha"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          umask 077
          app_dir=$1
          run_id=$2
          run_attempt=$3
          helper_sha=$4
          case "$run_id" in
            ''|*[!0-9]*) echo "运行编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "尝试编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$helper_sha" in
            ''|*[!0-9a-f]*) echo "诊断脚本哈希无效" >&2; exit 1 ;;
          esac
          remote_helper="/tmp/inkforge-token-usage-production-access-$run_id-$run_attempt.sh"
          trap 'rm -f -- "$remote_helper"' EXIT
          [ -n "$app_dir" ] || { echo "APP_DIR 未配置" >&2; exit 1; }
          [ -f "$remote_helper" ] || { echo "生产权限诊断脚本不存在" >&2; exit 1; }
          printf '%s  %s\n' "$helper_sha" "$remote_helper" | sha256sum --check --status -
          APP_DIR="$app_dir" sh "$remote_helper" access
          REMOTE

      - name: repair_production_access
        if: inputs.action == 'repair_production_access'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          helper="scripts/token-usage-production-migration.sh"
          helper_sha="$(sha256sum "$helper" | awk '{print $1}')"
          remote_helper="/tmp/inkforge-token-usage-production-repair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          scp -q \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$helper" "$SERVER_USER@$SERVER_HOST:$remote_helper"

          admin_user=""
          admin_mode=""
          for candidate in root ubuntu debian admin; do
            probe="$(ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              -o TCPKeepAlive=yes \
              -i "$ssh_dir/deploy_key" \
              "$candidate@$SERVER_HOST" \
              'if [ "$(id -u)" = "0" ]; then printf root; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then printf sudo; fi' \
              2>/dev/null || true)"
            case "$probe" in
              root|sudo) admin_user="$candidate"; admin_mode="$probe"; break ;;
            esac
          done
          [ -n "$admin_user" ] || { echo "现有部署密钥没有可用的服务器管理员通道" >&2; exit 1; }
          case "$admin_mode" in
            root) printf -v root_command 'bash -s -- %q' "$APP_DIR" ;;
            sudo) printf -v root_command 'sudo -n bash -s -- %q' "$APP_DIR" ;;
            *) echo "服务器管理员通道状态无效" >&2; exit 1 ;;
          esac
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$admin_user@$SERVER_HOST" \
            "$root_command" <<'REMOTE_ROOT'
          set -eu
          umask 077
          app_dir=$1
          [ "$(id -u)" = "0" ] || { echo "生产权限修复必须使用 root 通道" >&2; exit 1; }
          command -v runuser >/dev/null 2>&1 || { echo "缺少 postgres 管理通道" >&2; exit 1; }
          command -v python3 >/dev/null 2>&1 || { echo "缺少安全配置解析器" >&2; exit 1; }
          env_file="$app_dir/.env"
          [ -r "$env_file" ] || { echo "生产环境文件不可读" >&2; exit 1; }
          set +x
          app_role="$(python3 - "$env_file" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import parse_qsl, unquote, urlsplit

          matches = []
          for raw_line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("DATABASE_URL="):
                  value = line[len("DATABASE_URL=") :].strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                      value = value[1:-1].strip()
                  matches.append(value)
          if len(matches) != 1:
              raise SystemExit("database-role-check:database_url_count")
          normalized = matches[0].replace("postgresql+asyncpg://", "postgresql://", 1)
          parts = urlsplit(normalized)
          role = unquote(parts.username or "")
          query_pairs = parse_qsl(parts.query, keep_blank_values=True)
          query_keys = [key for key, _value in query_pairs]
          if (
              parts.scheme != "postgresql"
              or parts.hostname != "host.docker.internal"
              or parts.path != "/novelwriter"
              or parts.fragment
              or len(query_keys) != len(set(query_keys))
              or any(key not in {"application_name", "sslmode"} for key in query_keys)
              or not role
              or any(character in role for character in "\r\n")
          ):
              raise SystemExit("database-role-check:invalid")
          print(role, end="")
          PY
          )" || { echo "生产数据库角色解析失败" >&2; exit 1; }

          PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000' \
            timeout 60 runuser -u postgres -- psql -d novelwriter -v ON_ERROR_STOP=1 \
            -v app_role="$app_role" <<'SQL'
          \set QUIET 1
          BEGIN;
          SET LOCAL search_path = pg_catalog, public;

          DO $guard$
          BEGIN
            IF pg_catalog.current_database() <> 'novelwriter' THEN
              RAISE EXCEPTION '生产权限修复只允许在 novelwriter 执行';
            END IF;
            IF NOT (SELECT rolsuper FROM pg_catalog.pg_roles WHERE rolname = current_user) THEN
              RAISE EXCEPTION '生产权限修复要求数据库超级用户通道';
            END IF;
          END
          $guard$;

          CREATE TEMP TABLE video_backup_select_targets (name TEXT PRIMARY KEY) ON COMMIT DROP;
          INSERT INTO video_backup_select_targets (name) VALUES
            ('VideoAdaptationDecisionCommand'),
            ('VideoAdaptationTask'),
            ('VideoAsset'),
            ('VideoAssetBinding'),
            ('VideoChapterAdaptation'),
            ('VideoChapterAdaptationHead'),
            ('VideoCinematicScene'),
            ('VideoDramaticBeat'),
            ('VideoDramaticBeatSourceAnchor'),
            ('VideoEpisodeBoundary'),
            ('VideoEpisodePlanVersion'),
            ('VideoGenerationTask'),
            ('VideoProject'),
            ('VideoReviewDecisionCommand'),
            ('VideoScene'),
            ('VideoShot'),
            ('VideoShotPlanVersion'),
            ('VideoShotPromptHead'),
            ('VideoShotPromptVersion'),
            ('VideoShotPromptVisualReference'),
            ('VideoShotSourceAnchor'),
            ('VideoShotVisualReferenceBinding'),
            ('VideoShotVisualReferenceSet'),
            ('VideoVisualCanon'),
            ('VideoVisualCanonVersion');

          SELECT count(*) = 1 AND bool_and(rolcanlogin AND NOT rolsuper) AS role_ok
          FROM pg_catalog.pg_roles
          WHERE rolname = :'app_role'
          \gset
          \if :role_ok
          \else
            \echo '生产应用角色不存在、不可登录或意外拥有超级用户权限'
            \quit 4
          \endif

          SELECT count(*) = 25 AS tables_ok
          FROM video_backup_select_targets AS target
          JOIN pg_catalog.pg_class AS relation ON relation.relname = target.name
          JOIN pg_catalog.pg_namespace AS namespace
            ON namespace.oid = relation.relnamespace
           AND namespace.nspname = 'public'
          WHERE relation.relkind IN ('r', 'p')
          \gset
          \if :tables_ok
          \else
            \echo '生产视频表集合与固定权限修复范围不一致'
            \quit 4
          \endif

          SELECT
            count(*) FILTER (
              WHERE NOT pg_catalog.has_table_privilege(:'app_role', relation.oid, 'SELECT')
            ) = 25 AS all_missing,
            pg_catalog.bool_and(
              pg_catalog.has_table_privilege(:'app_role', relation.oid, 'SELECT')
            ) AS none_missing
          FROM video_backup_select_targets AS target
          JOIN pg_catalog.pg_class AS relation ON relation.relname = target.name
          JOIN pg_catalog.pg_namespace AS namespace
            ON namespace.oid = relation.relnamespace
           AND namespace.nspname = 'public'
          \gset
          \if :all_missing
            SELECT pg_catalog.format(
              'GRANT SELECT ON TABLE %s TO %I',
              pg_catalog.string_agg(
                pg_catalog.format('%I.%I', 'public', name),
                ', ' ORDER BY name
              ),
              :'app_role'
            )
            FROM video_backup_select_targets
            \gexec
          \else
            \if :none_missing
            \else
              \echo '生产视频表读取权限处于未知的部分修复状态'
              \quit 4
            \endif
          \endif

          SELECT pg_catalog.bool_and(
            pg_catalog.has_table_privilege(:'app_role', relation.oid, 'SELECT')
          ) AS grant_ok
          FROM video_backup_select_targets AS target
          JOIN pg_catalog.pg_class AS relation ON relation.relname = target.name
          JOIN pg_catalog.pg_namespace AS namespace
            ON namespace.oid = relation.relnamespace
           AND namespace.nspname = 'public'
          \gset
          \if :grant_ok
          \else
            \echo '生产视频表读取权限修复后校验失败'
            \quit 4
          \endif
          COMMIT;
          \echo 'video-select-grant:ok'
          SQL
          REMOTE_ROOT

          printf -v verify_command 'bash -s -- %q %q %q %q' \
            "$APP_DIR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$helper_sha"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$verify_command" <<'REMOTE_VERIFY'
          set -eu
          umask 077
          app_dir=$1
          run_id=$2
          run_attempt=$3
          helper_sha=$4
          case "$run_id" in
            ''|*[!0-9]*) echo "运行编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "尝试编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          remote_helper="/tmp/inkforge-token-usage-production-repair-$run_id-$run_attempt.sh"
          trap 'rm -f -- "$remote_helper"' EXIT
          printf '%s  %s\n' "$helper_sha" "$remote_helper" | sha256sum --check --status -
          access_report="$(APP_DIR="$app_dir" sh "$remote_helper" access)"
          printf '%s\n' "$access_report"
          printf '%s\n' "$access_report" | grep -qx 'table-select-missing:0'
          APP_DIR="$app_dir" sh "$remote_helper" backup
          REMOTE_VERIFY

      - name: migrate_dev
        if: inputs.action == 'migrate_dev'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          contract_path="$RUNNER_TEMP/inkforge-token-usage-schema-contract.json"
          rm -f "$contract_path"

          run_id="$GITHUB_RUN_ID"
          run_attempt="$GITHUB_RUN_ATTEMPT"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub 运行编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub 尝试编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          remote_sql="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.sql"
          remote_contract="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.json"
          remote_pgpass="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.pgpass"
          remote_database_url="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.database-url"
          cleanup_remote() {
            set +e
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o TCPKeepAlive=yes \
              -i "$ssh_dir/deploy_key" \
              "$SERVER_USER@$SERVER_HOST" \
              sh -s -- "$remote_sql" "$remote_contract" "$remote_pgpass" "$remote_database_url" \
              <<'REMOTE_CLEANUP' >/dev/null 2>&1
          set -eu
          umask 077
          sql_temp=$1
          contract_temp=$2
          pgpass_temp=$3
          database_url_temp=$4
          case "$sql_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.sql) ;;
            *) exit 1 ;;
          esac
          case "$contract_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.json) ;;
            *) exit 1 ;;
          esac
          case "$pgpass_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.pgpass) ;;
            *) exit 1 ;;
          esac
          case "$database_url_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.database-url) ;;
            *) exit 1 ;;
          esac
          rm -f -- "$sql_temp" "$contract_temp" "$pgpass_temp" "$database_url_temp"
          REMOTE_CLEANUP
          }
          trap cleanup_remote EXIT

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            sh -s -- "$remote_sql" "$remote_contract" "$remote_pgpass" "$remote_database_url" \
            <<'REMOTE_PREPARE'
          set -eu
          umask 077
          sql_temp=$1
          contract_temp=$2
          pgpass_temp=$3
          database_url_temp=$4
          case "$sql_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.sql) ;;
            *) echo "SQL 临时路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$contract_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.json) ;;
            *) echo "contract 临时路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$pgpass_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.pgpass) ;;
            *) echo "pgpass 临时路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$database_url_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.database-url) ;;
            *) echo "数据库 URL 临时路径不符合固定约定" >&2; exit 1 ;;
          esac
          rm -f -- "$pgpass_temp" "$database_url_temp"
          : > "$sql_temp"
          : > "$contract_temp"
          chmod 600 "$sql_temp" "$contract_temp"
          REMOTE_PREPARE

          scp -q \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SQL_PATH" "$SERVER_USER@$SERVER_HOST:$remote_sql"

          printf -v remote_command 'bash -s -- %q %q %q %q %q' \
            "$APP_DIR" "$remote_sql" "$remote_contract" "$run_id" "$run_attempt"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          app_dir=$1
          sql_temp=$2
          contract_temp=$3
          run_id=$4
          run_attempt=$5
          umask 077
          case "$sql_temp" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.sql) ;;
            *) echo "SQL 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$run_id" in
            ''|*[!0-9]*) echo "运行编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "尝试编号不符合固定临时路径约定" >&2; exit 1 ;;
          esac
          expected_sql="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.sql"
          expected_contract="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.json"
          pgpass_file="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.pgpass"
          database_url_file="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.database-url"
          migration_error_file="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.migration-error"
          [ "$sql_temp" = "$expected_sql" ] || {
            echo "SQL 临时文件路径不符合固定约定" >&2
            exit 1
          }
          case "$contract_temp" in
            "$expected_contract") ;;
            *) echo "contract 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$pgpass_file" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.pgpass) ;;
            *) echo "pgpass 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$database_url_file" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.database-url) ;;
            *) echo "数据库 URL 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$migration_error_file" in
            /tmp/inkforge-token-usage-details-[0-9]*-[0-9]*.migration-error) ;;
            *) echo "迁移错误临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          rm -f -- "$pgpass_file" "$database_url_file" "$migration_error_file"
          trap 'rm -f -- "$pgpass_file" "$database_url_file" "$migration_error_file"' EXIT
          [ -n "$app_dir" ] || { echo "APP_DIR 未配置" >&2; exit 1; }
          cd -- "$app_dir"

          set +x
          for required_command in psql pg_dump pg_restore sha256sum docker python3 timeout; do
            command -v "$required_command" >/dev/null 2>&1 || {
              echo "服务器缺少必要命令" >&2
              exit 1
            }
          done

          env_file="$app_dir/.env"
          [ -r "$env_file" ] || { echo ".env 不可读" >&2; exit 1; }
          database_url="$(python3 - "$env_file" "$pgpass_file" "$database_url_file" <<'PY'
          import os
          import sys
          from pathlib import Path
          from urllib.parse import parse_qsl, quote, unquote, urlsplit, urlunsplit

          SAFE_QUERY_KEYS = {"application_name", "sslmode"}

          class DatabaseUrlRejected(Exception):
              pass

          def write_private(path: str, payload: str) -> None:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as target:
                  target.write(payload)

          def escape_pgpass(value: str) -> str:
              return value.replace("\\", "\\\\").replace(":", "\\:")

          def derive_dev_database_url(path: str, pgpass_path: str, url_path: str) -> str:
              try:
                  matches = []
                  for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                      line = raw_line.strip()
                      if not line or line.startswith("#"):
                          continue
                      if line.startswith("DATABASE_URL="):
                          value = line[len("DATABASE_URL=") :].strip()
                          if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                              value = value[1:-1].strip()
                          matches.append(value)
                  if len(matches) != 1 or not matches[0]:
                      raise DatabaseUrlRejected("database_url_count")
                  value = matches[0]
                  normalized = (
                      "postgresql://" + value[len("postgresql+asyncpg://") :]
                      if value.startswith("postgresql+asyncpg://")
                      else value
                  )
                  try:
                      parts = urlsplit(normalized)
                  except ValueError:
                      raise DatabaseUrlRejected("url_split") from None
                  if (
                      parts.scheme != "postgresql" or not parts.netloc
                  ):
                      raise DatabaseUrlRejected("scheme_or_authority")
                  if parts.path != "/novelwriter":
                      raise DatabaseUrlRejected("source_database")
                  if parts.fragment:
                      raise DatabaseUrlRejected("fragment")
                  try:
                      query_pairs = parse_qsl(
                          parts.query, keep_blank_values=True
                      )
                  except ValueError:
                      raise DatabaseUrlRejected("query_syntax") from None
                  query_keys = [key for key, _value in query_pairs]
                  if (
                      len(query_keys) != len(set(query_keys))
                      or any(key not in SAFE_QUERY_KEYS for key in query_keys)
                  ):
                      raise DatabaseUrlRejected("query")
                  username = unquote(parts.username or "")
                  password = unquote(parts.password or "")
                  hostname = parts.hostname or ""
                  try:
                      port = parts.port or 5432
                  except ValueError:
                      raise DatabaseUrlRejected("port") from None
                  if not username or not password or not hostname:
                      raise DatabaseUrlRejected("credentials")
                  if hostname != "host.docker.internal":
                      raise DatabaseUrlRejected("source_host")
                  command_hostname = "127.0.0.1"
                  if any("\n" in value or "\r" in value for value in (username, password, hostname)):
                      raise DatabaseUrlRejected("newline")
                  pgpass = ":".join(
                      escape_pgpass(value)
                      for value in (command_hostname, str(port), "novelwriterdev", username, password)
                  ) + "\n"
                  dev_parts = parts._replace(path="/novelwriterdev")
                  write_private(pgpass_path, pgpass)
                  write_private(url_path, urlunsplit(dev_parts))
                  safe_netloc = f"{quote(username, safe='')}@{command_hostname}"
                  if parts.port is not None:
                      safe_netloc += f":{parts.port}"
                  return urlunsplit(dev_parts._replace(netloc=safe_netloc))
              except DatabaseUrlRejected:
                  raise
              except OSError:
                  raise DatabaseUrlRejected("filesystem") from None
              except UnicodeError:
                  raise DatabaseUrlRejected("encoding") from None
              except ValueError:
                  raise DatabaseUrlRejected("url_value") from None

          try:
              parsed = derive_dev_database_url(sys.argv[1], sys.argv[2], sys.argv[3])
          except DatabaseUrlRejected as exc:
              print(f"database-url-check:{exc}", file=sys.stderr)
              raise SystemExit(1) from None
          if parsed:
              print(parsed, end="")
          else:
              raise SystemExit(1)
          PY
          )" || { echo ".env DATABASE_URL 不能安全派生 novelwriterdev" >&2; exit 1; }
          [ -s "$pgpass_file" ] && [ -s "$database_url_file" ] || {
            echo "数据库凭据临时文件未生成" >&2
            exit 1
          }
          [ "$(stat -c '%a' "$pgpass_file")" = "600" ] \
            && [ "$(stat -c '%a' "$database_url_file")" = "600" ] || {
              echo "数据库凭据临时文件权限不正确" >&2
              exit 1
            }
          DATABASE_URL="$database_url"
          PGPASSFILE="$pgpass_file"
          export DATABASE_URL PGPASSFILE
          database_name="$(PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000' \
            timeout 45 psql -v ON_ERROR_STOP=1 -Atq "$database_url" \
            -c 'SELECT current_database()')" || {
              echo "novelwriterdev 只读连接检查失败" >&2
              exit 1
            }
          [ "$database_name" = "novelwriterdev" ] || {
            echo "目标数据库不是 novelwriterdev" >&2
            exit 1
          }

          backup_report=""
          if ! backup_report="$(timeout 600 env BACKUP_ROOT="$app_dir/.token-usage-dev-backups" sh scripts/backup.sh 2>/dev/null)"; then
            echo "数据库备份失败" >&2
            exit 1
          fi
          case "$backup_report" in
            备份完成：*) backup_dir="${backup_report#备份完成：}" ;;
            *) echo "无法定位新建备份目录" >&2; exit 1 ;;
          esac
          [ -d "$backup_dir" ] || { echo "备份目录不存在" >&2; exit 1; }
          (
            cd -- "$backup_dir"
            sha256sum --check SHA256SUMS >/dev/null 2>&1
          ) || { echo "备份 SHA256 校验失败" >&2; exit 1; }
          timeout 180 pg_restore --list "$backup_dir/database.dump" >/dev/null 2>&1 || {
            echo "备份 pg_restore list 校验失败" >&2
            exit 1
          }

          printf '%s  %s\n' \
            'BF6817A82F74E76B8F98D356749795A1EC04BCFCED090DB3F8B463F62ABCAB93' \
            "$sql_temp" | sha256sum --check --status -
          for attempt in 1 2; do
            if ! PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=30000' \
              timeout 180 psql -v ON_ERROR_STOP=1 "$database_url" -f "$sql_temp" \
                >/dev/null 2>"$migration_error_file"; then
              python3 - "$migration_error_file" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          checks = (
              ("TokenUsage 明细迁移只允许", "database-guard"),
              ("permission denied", "permission"),
              ("must be owner", "permission"),
              ("does not exist", "missing-object"),
              ("检查约束定义不符合迁移契约", "constraint-definition"),
              ("violates check constraint", "constraint-validation"),
              ("syntax error", "syntax"),
          )
          reason = next((code for marker, code in checks if marker in text), "unexpected")
          print(f"migration-error:{reason}", file=sys.stderr)
          PY
              echo "固定迁移执行失败" >&2
              exit 1
            fi
            : > "$migration_error_file"
          done
          rm -f -- "$migration_error_file"

          verification="$(PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=30000' \
            timeout 180 psql -v ON_ERROR_STOP=1 -Atq "$database_url" <<'SQL'
          BEGIN;
          SET TRANSACTION READ ONLY;
          WITH column_state AS (
              SELECT
                  count(*) AS column_count,
                  bool_and(
                      attribute.atttypid = 'int4'::regtype
                      AND NOT attribute.attnotnull
                      AND NOT attribute.atthasdef
                      AND attribute.attidentity = ''
                      AND attribute.attgenerated = ''
                  ) AS columns_valid
              FROM pg_attribute AS attribute
              JOIN pg_class AS table_definition ON table_definition.oid = attribute.attrelid
              JOIN pg_namespace AS namespace_definition
                  ON namespace_definition.oid = table_definition.relnamespace
              WHERE namespace_definition.nspname = 'public'
                AND table_definition.relname = 'TokenUsage'
                AND table_definition.relkind IN ('r', 'p')
                AND attribute.attname IN ('promptCacheMissTokens', 'reasoningTokens')
                AND NOT attribute.attisdropped
          ), constraint_state AS (
              SELECT
                  count(*) AS constraint_count,
                  bool_and(constraint_definition.convalidated) AS constraints_valid
              FROM pg_constraint AS constraint_definition
              WHERE constraint_definition.conrelid = 'public."TokenUsage"'::regclass
                AND constraint_definition.contype = 'c'
                AND constraint_definition.conname IN (
                    'TokenUsage_token_details_nonnegative_check',
                    'TokenUsage_prompt_cache_details_check',
                    'TokenUsage_reasoning_details_check'
                )
          ), null_state AS (
              SELECT NOT EXISTS (
                  SELECT 1
                  FROM public."TokenUsage"
                  WHERE "promptCacheMissTokens" IS NOT NULL
                     OR "reasoningTokens" IS NOT NULL
              ) AS existing_rows_null
          )
          SELECT CASE
              WHEN column_state.column_count = 2
               AND column_state.columns_valid IS TRUE
               AND constraint_state.constraint_count = 3
               AND constraint_state.constraints_valid IS TRUE
               AND null_state.existing_rows_null
              THEN 'ok'
              ELSE 'fail'
          END
          FROM column_state, constraint_state, null_state;
          COMMIT;
          SQL
          )"
          [ "$verification" = "ok" ] || {
            echo "迁移后只读结构与历史行校验失败" >&2
            exit 1
          }

          core_containers="$(timeout 180 docker ps \
            --filter label=com.docker.compose.project=inkforge \
            --filter label=com.docker.compose.service=core-api \
            --format '{{.ID}}')"
          [ -n "$core_containers" ] || { echo "未找到正在运行的 Core 容器" >&2; exit 1; }
          case "$core_containers" in
            *$'\n'*) echo "运行中的 Core 容器不唯一" >&2; exit 1 ;;
            *) core_container="$core_containers" ;;
          esac
          running_state="$(timeout 180 docker inspect --format '{{.State.Running}}' "$core_container" 2>/dev/null)" || {
            echo "无法读取 Core 容器运行状态" >&2
            exit 1
          }
          [ "$running_state" = "true" ] || { echo "Core 容器未运行" >&2; exit 1; }
          if ! timeout 180 docker exec -i "$core_container" python3 -c \
            'from inkforge_core.db.schema_guard import export_schema_contract' </dev/null >/dev/null 2>&1; then
            echo "当前 Core 容器不支持 schema_guard 只读导出" >&2
            exit 1
          fi
          container_contract="/tmp/inkforge-token-usage-details-$run_id-$run_attempt.json"
          if ! timeout 180 docker exec -i "$core_container" sh -eu -c \
            'test -w /tmp && rm -f "$1" && : > "$1" && rm -f "$1"' sh "$container_contract" \
            </dev/null >/dev/null 2>&1; then
            echo "Core 容器 /tmp 不可写" >&2
            exit 1
          fi
          cleanup_container_contract() {
            set +e
            timeout 180 docker exec -i "$core_container" rm -f "$container_contract" </dev/null >/dev/null 2>&1
            rm -f -- "$pgpass_file" "$database_url_file"
          }
          trap cleanup_container_contract EXIT
          if ! timeout 180 docker exec -i "$core_container" python3 -c \
            'import asyncio, sys; from inkforge_core.db.schema_guard import export_schema_contract; database_url = sys.stdin.read(); contract = asyncio.run(export_schema_contract(database_url, sys.argv[1])); print("schema-contract:" + str(contract["fingerprint"]))' \
            "$container_contract" < "$database_url_file"; then
            echo "schema_guard 只读 contract 导出失败" >&2
            exit 1
          fi
          : > "$contract_temp"
          if ! timeout 180 docker exec -i "$core_container" python3 -c \
            'import sys; from pathlib import Path; sys.stdout.buffer.write(Path(sys.argv[1]).read_bytes())' \
            "$container_contract" </dev/null >"$contract_temp" 2>/dev/null; then
            echo "无法传输 schema contract" >&2
            exit 1
          fi
          [ -s "$contract_temp" ] || { echo "schema contract 为空" >&2; exit 1; }
          chmod 600 "$contract_temp"
          REMOTE

          scp -q \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST:$remote_contract" "$contract_path"

          python - "$contract_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open(encoding="utf-8") as contract_file:
              contract = json.load(contract_file)
          if not isinstance(contract, dict) or not contract.get("fingerprint"):
              raise SystemExit("schema contract 格式无效")
          PY

      - name: 上传 dev schema contract
        if: inputs.action == 'migrate_dev'
        uses: actions/upload-artifact@v4
        with:
          name: token-usage-dev-schema-contract
          path: ${{ runner.temp }}/inkforge-token-usage-schema-contract.json
          if-no-files-found: error
