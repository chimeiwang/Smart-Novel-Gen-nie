name: TokenUsage 生产迁移（已退役）

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拒绝重跑已完成的一次性生产迁移
        shell: bash
        run: |
          echo 'token-usage-details-migration:error:workflow-retired' >&2
          echo '生产结构已完成迁移；历史 Workflow 的 SSH 身份必须保持撤销。' >&2
          exit 1
