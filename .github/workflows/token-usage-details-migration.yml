name: TokenUsage dev 迁移

"on":
  workflow_dispatch:
    inputs:
      action:
        description: 选择只读检查或执行 dev 迁移
        required: true
        type: choice
        options:
          - inspect
          - migrate_dev

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.APP_DIR }}
      SQL_PATH: scripts/migrations/20260823_token_usage_details.sql
      SQL_SHA256: 1DE1CD58C589403303B40F2AA2AE9DE3C44F272E5DD6C09159327535F04C5142

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 准备严格 SSH
        shell: bash
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          test -n "$SERVER_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          printf '%s\n' "$SERVER_SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: 校验固定迁移 SQL
        shell: bash
        run: |
          set -eu
          test -f "$SQL_PATH"
          printf '%s  %s\n' "$SQL_SHA256" "$SQL_PATH" | sha256sum --check --status -

      - name: inspect
        if: inputs.action == 'inspect'
        shell: bash
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          printf -v remote_command 'bash -s -- %q' "$APP_DIR"
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          app_dir=$1
          [ -n "$app_dir" ] || { echo "APP_DIR 未配置" >&2; exit 1; }
          cd -- "$app_dir"

          missing_uv=0
          for tool in psql pg_dump sha256sum docker uv; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s: present\n' "$tool"
            else
              printf '%s: missing\n' "$tool"
              if [ "$tool" = "uv" ]; then
                missing_uv=1
              fi
            fi
          done
          for env_file in .env.dev .env.development; do
            if [ -r "$env_file" ]; then
              printf '%s: present\n' "$env_file"
            else
              printf '%s: missing\n' "$env_file"
            fi
          done
          [ "$missing_uv" -eq 0 ] || { echo "服务器缺少 uv，停止检查" >&2; exit 1; }
          REMOTE

      - name: migrate_dev
        if: inputs.action == 'migrate_dev'
        shell: bash
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/inkforge-token-usage-ssh"
          contract_path="$RUNNER_TEMP/inkforge-token-usage-schema-contract.json"
          rm -f "$contract_path"

          printf -v create_sql_command 'mktemp --tmpdir=/tmp inkforge-token-usage-details.XXXXXX'
          remote_sql="$(ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$create_sql_command")"
          case "$remote_sql" in
            /tmp/inkforge-token-usage-details.*) ;;
            *) echo "服务器 SQL 临时路径不符合固定约定" >&2; exit 1 ;;
          esac

          remote_contract=""
          cleanup_remote() {
            set +e
            ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -i "$ssh_dir/deploy_key" \
              "$SERVER_USER@$SERVER_HOST" \
              "rm -f -- '$remote_sql'" >/dev/null 2>&1
            if [ -n "$remote_contract" ]; then
              ssh \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$ssh_dir/known_hosts" \
                -i "$ssh_dir/deploy_key" \
                "$SERVER_USER@$SERVER_HOST" \
                "rm -f -- '$remote_contract'" >/dev/null 2>&1
            fi
          }
          trap cleanup_remote EXIT

          printf -v create_contract_command 'mktemp --tmpdir=/tmp inkforge-token-usage-contract.XXXXXX.json'
          remote_contract="$(ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$create_contract_command")"
          case "$remote_contract" in
            /tmp/inkforge-token-usage-contract.*.json) ;;
            *) echo "服务器 contract 临时路径不符合固定约定" >&2; exit 1 ;;
          esac

          scp -q \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/deploy_key" \
            "$SQL_PATH" "$SERVER_USER@$SERVER_HOST:$remote_sql"

          printf -v remote_command 'bash -s -- %q %q %q' "$APP_DIR" "$remote_sql" "$remote_contract"
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          app_dir=$1
          sql_temp=$2
          contract_temp=$3
          case "$sql_temp" in
            /tmp/inkforge-token-usage-details.*) ;;
            *) echo "SQL 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          case "$contract_temp" in
            /tmp/inkforge-token-usage-contract.*.json) ;;
            *) echo "contract 临时文件路径不符合固定约定" >&2; exit 1 ;;
          esac
          [ -n "$app_dir" ] || { echo "APP_DIR 未配置" >&2; exit 1; }
          cd -- "$app_dir"

          database_env_file=""
          database_env_count=0
          for candidate in "$app_dir/.env.dev" "$app_dir/.env.development"; do
            if [ -r "$candidate" ] && (
              set +x
              unset DATABASE_URL
              set -a
              . "$candidate" >/dev/null 2>&1
              set +a
              [ -n "${DATABASE_URL:-}" ]
            ); then
              database_env_file="$candidate"
              database_env_count=$((database_env_count + 1))
            fi
          done
          [ "$database_env_count" -eq 1 ] || {
            echo "dev 环境文件必须恰好一个可读且含非空 DATABASE_URL" >&2
            exit 1
          }

          set +x
          unset DATABASE_URL
          set -a
          . "$database_env_file" >/dev/null 2>&1
          set +a
          [ -n "${DATABASE_URL:-}" ] || { echo "DATABASE_URL 为空" >&2; exit 1; }

          for required_command in psql pg_dump pg_restore sha256sum uv; do
            command -v "$required_command" >/dev/null 2>&1 || {
              echo "服务器缺少必要命令" >&2
              exit 1
            }
          done

          backup_report=""
          if ! backup_report="$(BACKUP_ROOT=/srv/backups/inkforge-dev sh scripts/backup.sh 2>/dev/null)"; then
            echo "数据库备份失败" >&2
            exit 1
          fi
          case "$backup_report" in
            备份完成：*) backup_dir="${backup_report#备份完成：}" ;;
            *) echo "无法定位新建备份目录" >&2; exit 1 ;;
          esac
          [ -d "$backup_dir" ] || { echo "备份目录不存在" >&2; exit 1; }
          (
            cd -- "$backup_dir"
            sha256sum --check SHA256SUMS >/dev/null 2>&1
          ) || { echo "备份 SHA256 校验失败" >&2; exit 1; }
          pg_restore --list "$backup_dir/database.dump" >/dev/null 2>&1 || {
            echo "备份 pg_restore list 校验失败" >&2
            exit 1
          }

          printf '%s  %s\n' \
            '1DE1CD58C589403303B40F2AA2AE9DE3C44F272E5DD6C09159327535F04C5142' \
            "$sql_temp" | sha256sum --check --status -
          database_url="$(printf '%s' "$DATABASE_URL" | sed 's#^postgresql+asyncpg://#postgresql://#')"
          for attempt in 1 2; do
            if ! psql -v ON_ERROR_STOP=1 "$database_url" -f "$sql_temp" >/dev/null 2>&1; then
              echo "固定迁移执行失败" >&2
              exit 1
            fi
          done

          verification="$(psql -v ON_ERROR_STOP=1 -Atq "$database_url" <<'SQL'
          BEGIN;
          SET TRANSACTION READ ONLY;
          WITH column_state AS (
              SELECT
                  count(*) AS column_count,
                  bool_and(
                      attribute.atttypid = 'int4'::regtype
                      AND NOT attribute.attnotnull
                      AND NOT attribute.atthasdef
                      AND attribute.attidentity = ''
                      AND attribute.attgenerated = ''
                  ) AS columns_valid
              FROM pg_attribute AS attribute
              JOIN pg_class AS table_definition ON table_definition.oid = attribute.attrelid
              JOIN pg_namespace AS namespace_definition
                  ON namespace_definition.oid = table_definition.relnamespace
              WHERE namespace_definition.nspname = 'public'
                AND table_definition.relname = 'TokenUsage'
                AND table_definition.relkind IN ('r', 'p')
                AND attribute.attname IN ('promptCacheMissTokens', 'reasoningTokens')
                AND NOT attribute.attisdropped
          ), constraint_state AS (
              SELECT
                  count(*) AS constraint_count,
                  bool_and(constraint_definition.convalidated) AS constraints_valid
              FROM pg_constraint AS constraint_definition
              WHERE constraint_definition.conrelid = 'public."TokenUsage"'::regclass
                AND constraint_definition.contype = 'c'
                AND constraint_definition.conname IN (
                    'TokenUsage_token_details_nonnegative_check',
                    'TokenUsage_prompt_cache_details_check',
                    'TokenUsage_reasoning_details_check'
                )
          ), null_state AS (
              SELECT NOT EXISTS (
                  SELECT 1
                  FROM public."TokenUsage"
                  WHERE "promptCacheMissTokens" IS NOT NULL
                     OR "reasoningTokens" IS NOT NULL
              ) AS existing_rows_null
          )
          SELECT CASE
              WHEN column_state.column_count = 2
               AND column_state.columns_valid IS TRUE
               AND constraint_state.constraint_count = 3
               AND constraint_state.constraints_valid IS TRUE
               AND null_state.existing_rows_null
              THEN 'ok'
              ELSE 'fail'
          END
          FROM column_state, constraint_state, null_state;
          COMMIT;
          SQL
          )"
          [ "$verification" = "ok" ] || {
            echo "迁移后只读结构与历史行校验失败" >&2
            exit 1
          }

          rm -f "$contract_temp"
          if ! uv run python scripts/export_schema_contract.py --database-url "$DATABASE_URL" --output "$contract_temp" >/dev/null 2>&1; then
            echo "schema contract 只读导出失败" >&2
            exit 1
          fi
          [ -s "$contract_temp" ] || { echo "schema contract 为空" >&2; exit 1; }
          chmod 600 "$contract_temp"
          REMOTE

          scp -q \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/deploy_key" \
            "$SERVER_USER@$SERVER_HOST:$remote_contract" "$contract_path"

          python - "$contract_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open(encoding="utf-8") as contract_file:
              contract = json.load(contract_file)
          if not isinstance(contract, dict) or not contract.get("fingerprint"):
              raise SystemExit("schema contract 格式无效")
          PY

      - name: 上传 dev schema contract
        if: inputs.action == 'migrate_dev'
        uses: actions/upload-artifact@v4
        with:
          name: token-usage-dev-schema-contract
          path: ${{ runner.temp }}/inkforge-token-usage-schema-contract.json
          if-no-files-found: error
